<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="782" viewBox="0 0 1440 782"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="720" height="660"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="720" height="660"/></clipPath></defs><rect width="1440" height="782" fill="#FFFFFF"/><text x="720.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">SM-2015-3 (二)　等值參數與抗隆起，以及兩個子題的連動</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="720" height="660" fill="#FFFFFF"/><rect x="6" y="6" width="708" height="648" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="360.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">等值參數怎麼來的</text><text x="360.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">砂土的摩擦抗力先換算成等值凝聚力，再與黏土加權</text><polygon points="125.92,224.62 475.90,224.62 475.90,118.56 125.92,118.56" fill="rgba(180,83,9,0.16)" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="125.92,578.14 475.90,578.14 475.90,224.62 125.92,224.62" fill="rgba(63,74,90,0.14)" stroke="none" stroke-width="1" opacity="1.0"/><line x1="125.92" y1="224.62" x2="475.90" y2="224.62" stroke="#6B7684" stroke-width="1.8" stroke-linecap="round" opacity="1.0"/><line x1="125.92" y1="401.38" x2="475.90" y2="401.38" stroke="#3F4A5A" stroke-width="3.0" stroke-linecap="round" opacity="1.0"/><line x1="125.92" y1="118.56" x2="125.92" y2="578.14" stroke="#3F4A5A" stroke-width="3.4" stroke-linecap="round" opacity="1.0"/><text x="203.80" y="168.06" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">砂土　H<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 3 m、γ</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 16.5、φ</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 32°</tspan></text><text x="205.67" y="196.34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">C<tspan dy="3.60" font-size="8.16">u</tspan><tspan dy="-3.60" font-size="12">s = ½γ</tspan><tspan dy="3.60" font-size="8.16">s</tspan><tspan dy="-3.60" font-size="12">·H</tspan><tspan dy="3.60" font-size="8.16">s</tspan><tspan dy="-3.60" font-size="12">·K</tspan><tspan dy="3.60" font-size="8.16">s</tspan><tspan dy="-3.60" font-size="12">·tanφ</tspan><tspan dy="3.60" font-size="8.16">s</tspan><tspan dy="-3.60" font-size="12"> = 15.47 kN/m²</tspan></text><text x="215.76" y="309.46" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">黏土　γ<tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> = 17.5、C</tspan><tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> = 30 kN/m²</tspan></text><text x="302.68" y="457.94" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">開挖面 z = 8 m（下方仍為黏土）</text><line x1="71.12" y1="401.38" x2="71.12" y2="401.38" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="71.12" y1="118.56" x2="71.12" y2="118.56" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="71.12" y1="401.38" x2="71.12" y2="118.56" stroke="#8A94A6" stroke-width="1.2"/><polygon points="71.12,401.38 74.32,393.38 67.92,393.38" fill="#8A94A6"/><polygon points="71.12,118.56 67.92,126.56 74.32,126.56" fill="#8A94A6"/><text x="57.12" y="259.97" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">H = 8 m</text><line x1="101.17" y1="224.62" x2="101.17" y2="224.62" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="101.17" y1="118.56" x2="101.17" y2="118.56" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="101.17" y1="224.62" x2="101.17" y2="118.56" stroke="#8A94A6" stroke-width="1.2"/><polygon points="101.17,224.62 104.37,216.62 97.97,216.62" fill="#8A94A6"/><polygon points="101.17,118.56 97.97,126.56 104.37,126.56" fill="#8A94A6"/><text x="89.17" y="171.59" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="11.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">3 m</text><text x="174.91" y="544.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5"> = (16.5×3 + 17.5×5)/8 = 17.125 kN/m³　⇒　γ</tspan><tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5">H = 137.0 kN/m²</tspan></text><text x="249.08" y="568.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">C<tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5"> = (15.47×3 + 30×5)/8 = 24.55 kN/m²</tspan></text><text x="195.41" y="592.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">N = γ<tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5">H / C</tspan><tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5"> = 137.0 / 24.55 = 5.58 ＞ 4 ⇒ 軟弱至中度黏土</tspan></text><text x="185.53" y="616.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">p<tspan dy="3.75" font-size="8.5">a</tspan><tspan dy="-3.75" font-size="12.5"> = max(γ</tspan><tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5">H − 4C</tspan><tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5">, 0.3γ</tspan><tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5">H) = max(38.8, 41.1) = 41.1 kN/m²</tspan></text><text x="155.60" y="642.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（若改用 Das 的 Peck 原式，C<tspan dy="3.45" font-size="7.82">av</tspan><tspan dy="-3.45" font-size="11.5"> = 39.72、N = 3.45 ≤ 4 會判成堅硬黏土，見 §5）</tspan></text></g><g transform="translate(720,76)" clip-path="url(#sdclip1)"><rect width="720" height="660" fill="#FFFFFF"/><rect x="6" y="6" width="708" height="648" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="360.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">抗隆起：Bjerrum–Eide 法（三維修正）</text><text x="360.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">題目給了 B 與 L，就是要你用形狀修正</text><text x="40.00" y="116.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">Skempton N<tspan dy="3.90" font-size="8.84">c</tspan><tspan dy="-3.90" font-size="13"> 的兩個修正</tspan></text><text x="40.00" y="146.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">形狀修正　1 + 0.2 B/L = 1 + 0.2×6/15</text><text x="674.00" y="146.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">= 1.080</text><text x="40.00" y="176.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">深度修正　1 + 0.2 D/B = 1 + 0.2×8/6</text><text x="674.00" y="176.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">= 1.2667</text><text x="40.00" y="206.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">N<tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> = 5 × 1.080 × 1.2667</tspan></text><text x="674.00" y="206.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">= 6.840</text><text x="40.00" y="236.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">上限檢核　7.5(1+0.2B/L)</text><text x="674.00" y="236.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">= 8.100 ✓ 未超過</text><text x="40.00" y="300.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = N<tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-4.05" font-size="13.5">·C</tspan><tspan dy="4.05" font-size="9.18">u</tspan><tspan dy="-4.05" font-size="13.5"> / (γ</tspan><tspan dy="4.05" font-size="9.18">av</tspan><tspan dy="-4.05" font-size="13.5">H) = 6.840 × 30 / 137.0</tspan></text><text x="40.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">抵抗　N<tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5">·C</tspan><tspan dy="3.75" font-size="8.5">u</tspan></text><rect x="250" y="328" width="380" height="32" rx="8" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="250" y="328" width="380.0" height="32" rx="8" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="618.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#FFFFFF" text-anchor="end" dominant-baseline="middle" font-weight="700">205.2</text><text x="644.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">kN/m²</text><text x="40.00" y="388.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">驅動　γ<tspan dy="3.75" font-size="8.5">av</tspan><tspan dy="-3.75" font-size="12.5">H</tspan></text><rect x="250" y="372" width="380" height="32" rx="8" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="250" y="372" width="253.70370370370372" height="32" rx="8" fill="#C0392B" stroke="none" stroke-width="1"/><text x="491.70" y="388.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#FFFFFF" text-anchor="end" dominant-baseline="middle" font-weight="700">137.0</text><text x="644.00" y="388.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">kN/m²</text><text x="40.00" y="452.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="20" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = 1.498</text><text x="190.00" y="454.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（≥ 1.5，坑底不會隆起）</text><text x="40.00" y="536.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">這個 FS 反過來鎖定第一部分的 m 係數：</text><text x="40.00" y="560.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">Peck 的 m = 0.4 只用在「坑底軟弱正常壓密黏土、深厚、抗隆起偏低」的情況。</text><text x="40.00" y="584.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">本題 FS = 1.50 ≥ 1.5，不屬該情形，故 m = 1.0。</text><text x="40.00" y="608.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">若誤取 m = 0.4：p<tspan dy="3.75" font-size="8.5">a</tspan><tspan dy="-3.75" font-size="12.5"> = 137.0 − 0.4×98.2 = 97.7 kN/m²，是本解的 2.38 倍。</tspan></text></g><text x="720.0" y="760" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">先算抗隆起、再回頭確認 m 係數，是本題最容易被忽略的一條線。</text></svg>