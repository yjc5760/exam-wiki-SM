iti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">LL = 50</text><line x1="170.00" y1="626.80" x2="353.45" y2="626.80" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="170.00" y1="610.90" x2="383.04" y2="610.90" stroke="#6B7684" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/><text x="378.80" y="618.85" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">CL-ML</text><rect x="596.3399999999999" y="460.312" width="184.12" height="25" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="688.40" y="472.81" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">A 線　PI = 0.73(LL − 20)</text><rect x="350.75" y="461.11" width="214.5" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="458.00" y="473.36" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="middle" dominant-baseline="middle" font-weight="700">U 線　PI = 0.9(LL − 8)（上界）</text><text x="407.60" y="579.10" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">CL</text><text x="702.80" y="414.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">CH</text><text x="472.40" y="624.15" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">ML</text><text x="702.80" y="563.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">MH</text><circle cx="494.00" cy="526.10" r="7.4" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2.4"/><rect x="504.0" y="513.6" width="226.50000000000003" height="25" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="510.00" y="526.10" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">示範點 (LL = 45, PI = 23) ⇒ CL</text><text x="520.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 2　塑性指數是「一條軸上的一段」，塑性圖是它的分類用途</text><text x="520.00" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">⚠ SL / PL / LL 為自訂示範值；A 線與 U 線為 USCS（ASTM D2487）規範式</text><text x="520.00" y="296.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">（三）～（四）塑性圖：同一個 PI，落在 A 線上下代表完全不同的土</text><text x="520.00" y="712.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">示範點 (LL = 45, PI = 23)：A 線在此為 0.73×(45−20) = 18.25，點在其上；又 LL ＜ 50 ⇒ 判為 CL（低塑性黏土）。</text><text x="520.00" y="738.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">攔錯用：PI 只有一個數字，講不出是黏土還是粉土——一定要配 LL 一起看。</text><text x="520.00" y="764.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">A 線之上為黏土（C），之下為粉土（M）；LL = 50 分低塑性（L）與高塑性（H）。</text><text x="520.00" y="792.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">U 線是經驗上界：任何試驗點落在 U 線之上，代表試驗有誤，應重做。</text><text x="267.58" y="818.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（五）壓縮指數 C<tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> 與本圖的曲率係數 C</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> 同符號但意義完全不同——前者是 e–log p′ 的斜率，</tspan></text><text x="342.04" y="842.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">圖解見 SM-2003-2 圖 3；作答時可把曲率係數寫成 C<tspan dy="3.75" font-size="8.5">z</tspan><tspan dy="-3.75" font-size="12.5"> 以免混淆。</tspan></text></svg>