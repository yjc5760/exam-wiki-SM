xt-anchor="end" dominant-baseline="middle" font-weight="700">U = 60% 換式分界</text><line x1="225.26" y1="444.00" x2="225.26" y2="282.00" stroke="#2E7D6F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><line x1="225.26" y1="282.00" x2="281.40" y2="300.00" stroke="#2E7D6F" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><circle cx="225.26" cy="282.00" r="6.4" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="3.0"/><text x="289.40" y="300.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">本題(二)  U = 45% → T<tspan dy="3.90" font-size="8.84">v</tspan><tspan dy="-3.90" font-size="13"> = 0.159</tspan></text><line x1="238.69" y1="444.00" x2="238.69" y2="264.00" stroke="#2E7D6F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><line x1="238.69" y1="264.00" x2="281.40" y2="256.80" stroke="#2E7D6F" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><circle cx="238.69" cy="264.00" r="6.4" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="3.0"/><text x="289.40" y="256.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">實驗室    U = 50% → T<tspan dy="3.90" font-size="8.84">v</tspan><tspan dy="-3.90" font-size="13"> = 0.196</tspan></text><line x1="473.28" y1="444.00" x2="473.28" y2="120.00" stroke="#7C3AED" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4" opacity="1.0"/><line x1="473.28" y1="120.00" x2="466.80" y2="98.40" stroke="#7C3AED" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><circle cx="473.28" cy="120.00" r="6.4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3.0"/><text x="284.68" y="98.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#7C3AED" text-anchor="start" dominant-baseline="middle" font-weight="700">本題(一)  U = 90% → T<tspan dy="3.90" font-size="8.84">v</tspan><tspan dy="-3.90" font-size="13"> = 0.848</tspan></text><text x="480.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 2　考卷給的兩條參考公式，各自負責哪一段</text><text x="480.00" y="56.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">縱軸 U 向上遞增（考卷圖為倒置座標，此處採一般數學慣例）</text><text x="367.24" y="520.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">T<tspan dy="4.35" font-size="9.86">v</tspan><tspan dy="-4.35" font-size="14.5"> = π/4 · U²                 （U ≤ 60%）</tspan></text><text x="335.05" y="546.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#7C3AED" text-anchor="start" dominant-baseline="middle" font-weight="700">T<tspan dy="4.35" font-size="9.86">v</tspan><tspan dy="-4.35" font-size="14.5"> = −0.933 · log(1−U) − 0.085   （U > 60%）</tspan></text><text x="339.33" y="570.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">兩式皆由考卷提供，不必自己背；要自己判的是 H<tspan dy="3.75" font-size="8.5">dr</tspan></text><text x="169.34" y="594.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">攔錯用：三個工作點分屬兩段。若一律用 π/4·U² 去算 U = 90%，得 T<tspan dy="3.90" font-size="8.84">v</tspan><tspan dy="-3.90" font-size="13"> = 0.636 而非 0.848，t90 會少估 25%。</tspan></text></svg>