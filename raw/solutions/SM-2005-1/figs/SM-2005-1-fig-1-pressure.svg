50 171.71,455.98" fill="#1D4ED8"/><line x1="150.32" y1="490.96" x2="171.71" y2="490.96" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round"/><polygon points="177.71,490.96 171.71,493.72 171.71,488.20" fill="#1D4ED8"/><line x1="150.32" y1="523.19" x2="171.71" y2="523.19" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round"/><polygon points="177.71,523.19 171.71,525.95 171.71,520.43" fill="#1D4ED8"/><text x="64.86" y="403.96" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">p<tspan dy="3.60" font-size="8.16">net</tspan><tspan dy="-3.60" font-size="12"> = 4c − γ</tspan><tspan dy="3.60" font-size="8.16">s</tspan><tspan dy="-3.60" font-size="12"> H</tspan></text><text x="142.32" y="421.96" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">= 180 − 162 = 18.0 kPa</text><circle cx="211.72" cy="289.82" r="5.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.6"/><text x="220.72" y="304.82" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">P<tspan dy="3.75" font-size="8.5">a</tspan><tspan dy="-3.75" font-size="12.5"> = 223.99 kN/m</tspan></text><circle cx="164.89" cy="458.74" r="5.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.6"/><text x="83.63" y="496.07" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">P<tspan dy="3.75" font-size="8.5">net</tspan><tspan dy="-3.75" font-size="12.5"> = 18.0·D</tspan></text><text x="259.91" y="624.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">對地錨取矩：P<tspan dy="3.75" font-size="8.5">net</tspan><tspan dy="-3.75" font-size="12.5">·(7.5 + 0.5D) = P</tspan><tspan dy="3.75" font-size="8.5">a</tspan><tspan dy="-3.75" font-size="12.5">·4.5　⇒　D² + 15D − 111.996 = 0</tspan></text><text x="450.00" y="650.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">⇒　D = 5.471 m　（理論最少入土深度，FS = 1.0）</text><text x="267.41" y="676.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">水平力平衡：T = P<tspan dy="3.75" font-size="8.5">a</tspan><tspan dy="-3.75" font-size="12.5"> − p</tspan><tspan dy="3.75" font-size="8.5">net</tspan><tspan dy="-3.75" font-size="12.5">·D = 223.99 − 18.0×5.471 = 125.51 kN/m</tspan></text><text x="450.00" y="702.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">力矩點必須取在地錨——這樣才能消去未知的 T，只剩 D 一個未知數</text></svg>