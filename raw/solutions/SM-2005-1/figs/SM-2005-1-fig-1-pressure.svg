<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720"><rect width="900" height="720" fill="#FFFFFF"/><rect x="6" y="6" width="888" height="708" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="450.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">SM-2005-1　版樁土壓力分布與自由端支撐的力矩平衡</text><text x="249.54" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">砂土段三角形主動土壓；黏土段淨被動土壓為與深度無關的定值 4c − γ<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> H</tspan></text><polygon points="179.47,378.18 403.30,378.18 403.30,113.12 179.47,113.12" fill="rgba(180,83,9,0.14)" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="55.78,577.58 403.30,577.58 403.30,378.18 55.78,378.18" fill="rgba(63,74,90,0.14)" stroke="none" stroke-width="1" opacity="1.0"/><line x1="55.78" y1="378.18" x2="403.30" y2="378.18" stroke="#6B7684" stroke-width="2.2" stroke-linecap="round" opacity="1.0"/><line x1="179.47" y1="113.12" x2="403.30" y2="113.12" stroke="#6B7684" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><text x="344.40" y="201.47" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">砂土</text><text x="283.29" y="222.09" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.45" font-size="7.82">s</tspan><tspan dy="-3.45" font-size="11.5"> = 18、φ</tspan><tspan dy="3.45" font-size="7