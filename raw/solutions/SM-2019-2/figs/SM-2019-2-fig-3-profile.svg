ke="#B45309" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 5" opacity="1.0"/><rect x="285.44000000000005" y="310.4" width="122.15999999999998" height="24" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="401.60" y="322.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">層中央（不排水面）</text><line x1="427.80" y1="387.20" x2="427.80" y2="387.20" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="427.80" y1="257.60" x2="427.80" y2="257.60" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="427.80" y1="387.20" x2="427.80" y2="257.60" stroke="#8A94A6" stroke-width="1.2"/><polygon points="427.80,387.20 431.00,379.20 424.60,379.20" fill="#8A94A6"/><polygon points="427.80,257.60 424.60,265.60 431.00,265.60" fill="#8A94A6"/><text x="445.80" y="322.40" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">H = 4 m</text><line x1="515.28" y1="322.40" x2="515.28" y2="322.40" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="515.28" y1="257.60" x2="515.28" y2="257.60" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="515.28" y1="322.40" x2="515.28" y2="257.60" stroke="#B45309" stroke-width="1.2"/><polygon points="515.28,322.40 518.48,314.40 512.08,314.40" fill="#B45309"/><polygon points="515.28,257.60 512.08,265.60 518.48,265.60" fill="#B45309"/><text x="548.80" y="290.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">H<tspan dy="4.05" font-size="9.18">dr</tspan><tspan dy="-4.05" font-size="13.5"> = 2 m</tspan></text><text x="236.61" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">圖 3　黏土層上下皆為砂 ⇒ 雙面排水，H<tspan dy="5.25" font-size="11.9">dr</tspan><tspan dy="-5.25" font-size="17.5"> 取層厚的一半</tspan></text><text x="224.16" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">題幹給的黏土參數：e<tspan dy="3.75" font-size="8.5">0</tspan><tspan dy="-3.75" font-size="12.5"> = 0.9、C</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> = 0.25、c</tspan><tspan dy="3.75" font-size="8.5">v</tspan><tspan dy="-3.75" font-size="12.5"> = 0.008 m²/day、層中央 p'</tspan><tspan dy="3.75" font-size="8.5">0</tspan><tspan dy="-3.75" font-size="12.5"> = 70 kPa</tspan></text><text x="209.58" y="516.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">攔錯用：H<tspan dy="3.90" font-size="8.84">dr</tspan><tspan dy="-3.90" font-size="13"> 誤取 4 m，t 會放大 4 倍。判準是「上下都有透水層」，不是層厚本身。</tspan></text><text x="450.00" y="540.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">本圖為考卷圖一之向量重繪；原圖僅印出 4 m 一個尺寸，其餘由題幹文字給定。</text></svg>