5"> 與 R</tspan><tspan dy="5.25" font-size="11.9">c</tspan><tspan dy="-5.25" font-size="17.5"> 是同一根 e 軸上的兩把不同的尺</tspan></text><text x="279.12" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">D<tspan dy="3.75" font-size="8.5">r</tspan><tspan dy="-3.75" font-size="12.5"> 對 e 線性、兩端固定為 0 與 100%；R</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> 對 γ</tspan><tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> 線性，故對 e 非線性、且左端不是 0</tspan></text><text x="281.26" y="596.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">同一個夯實後狀態：D<tspan dy="4.05" font-size="9.18">r</tspan><tspan dy="-4.05" font-size="13.5"> = 79.6%，R</tspan><tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-4.05" font-size="13.5"> = 95.0%——兩個數字都對，但意義不同。</tspan></text><text x="249.28" y="626.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">攔錯用：題目要的是 R<tspan dy="3.90" font-size="8.84">c</tspan><tspan dy="-3.90" font-size="13"> = 95%，若誤讀成 D</tspan><tspan dy="3.90" font-size="8.84">r</tspan><tspan dy="-3.90" font-size="13"> = 95%，會得 e</tspan><tspan dy="3.90" font-size="8.84">f</tspan><tspan dy="-3.90" font-size="13"> = 0.95 − 0.95×0.40 = 0.570，</tspan></text><text x="505.00" y="652.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">ΔH 變成 0.206 m（正解 0.135 m），整整多了 52%。</text></svg>