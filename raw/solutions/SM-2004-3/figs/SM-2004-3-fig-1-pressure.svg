rn Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">6 m</text><text x="426.36" y="261.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">非凝聚性回填土　c = 0、φ = 35°</text><text x="426.36" y="282.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">水位以下改用 γ' = 19.2 − 9.81 = 9.39 kN/m³</text><text x="299.92" y="397.94" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">水位以下：有效應力 σ<tspan dy="3.60" font-size="8.16">v</tspan><tspan dy="-3.60" font-size="12">' 用 γ'，另加孔隙水壓 u</tspan></text><line x1="189.94" y1="383.94" x2="134.03" y2="383.94" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/><polygon points="122.03,383.94 134.03,378.42 134.03,389.46" fill="#C0392B"/><text x="252.82" y="367.94" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">土壓力＋水壓力推向左</text><line x1="71.73" y1="520.76" x2="170.39" y2="520.76" stroke="#1D4ED8" stroke-width="3.6" stroke-linecap="round"/><polygon points="182.39,520.76 170.39,526.28 170.39,515.24" fill="#1D4ED8"/><text x="127.06" y="540.76" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">牆體可抵抗 146 kN/m</text><text x="128.64" y="596.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">忽略牆摩擦（δ = 0）且地表水平 ⇒ 適用 Rankine，K<tspan dy="3.90" font-size="8.84">A</tspan><tspan dy="-3.90" font-size="13"> = tan²(45° − φ/2) = 0.2710</tspan></text><text x="360.00" y="620.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">「忽略毛細現象」＝ 水位以上不產生吸力，該段仍以 u = 0 計算</text></g><g transform="translate(720,76)" clip-path="url(#sdclip1)"><rect width="720" height="660" fill="#FFFFFF"/><rect x="6" y="6" width="708" height="648" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="360.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">牆背壓力分布：無水 vs. x = 3.826 m</text><text x="360.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">有效土壓力只掉一點，水壓力卻是滿額加上去</text><line x1="142.03" y1="475.50" x2="142.03" y2="153.29" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round" opacity="1.0"/><line x1="142.03" y1="153.29" x2="133.44" y2="153.29" stroke="#6B7684" stroke-width="1.3" stroke-linecap="round" opacity="1.0"/><text x="129.14" y="153.29" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">0</text><line x1="142.03" y1="260.70" x2="133.44" y2="260.70" stroke="#6B7684" stroke-width="1.3" stroke-linecap="round" opacity="1.0"/><text x="129.14" y="260.70" font-family="'Noto Sans CJK TC','No