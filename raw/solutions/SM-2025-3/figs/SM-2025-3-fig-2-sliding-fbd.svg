 fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">（W·tanδ = W·tan0° = 0）</text><text x="250.77" y="642.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = R / P<tspan dy="4.80" font-size="10.88">A</tspan><tspan dy="-4.80" font-size="16"> = 180.0 / 138.83 = 1.297</tspan></text><text x="380.00" y="667.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">＜ 1.5，抗滑動不安全</text></g><g transform="translate(760,76)" clip-path="url(#sdclip1)"><rect width="760" height="700" fill="#FFFFFF"/><rect x="6" y="6" width="748" height="688" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="380.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">兩種讀圖結果的差距</text><text x="380.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">數字都「看起來合理」，只有尺寸鏈能分辨</text><text x="38.00" y="132.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">正確讀法　H = 7 m、B = 6 m</text><text x="38.00" y="178.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">驅動 P<tspan dy="3.90" font-size="8.84">A</tspan></text><rect x="250" y="161" width="330" he