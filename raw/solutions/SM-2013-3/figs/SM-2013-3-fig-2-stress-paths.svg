','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">卻在同一個 q = 137.5 破壞、</text><text x="838.00" y="170.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">扣掉各自的 u 之後落在同一個 p'：</text><text x="838.00" y="220.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">AC： 417.5 − (+125) = 292.5</text><text x="838.00" y="245.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">LE： 262.5 − (-30) = 292.5</text><text x="838.00" y="295.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">這就是「ESP 唯一」的具體驗證，</text><text x="838.00" y="320.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">也是本題能由 AC 推出 LE 的唯一依據。</text><text x="838.00" y="370.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">φ' = 28.04°（唯一）</text><text x="838.00" y="395.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">φcu：AC 19.23° vs LE 31.59°</text><text x=