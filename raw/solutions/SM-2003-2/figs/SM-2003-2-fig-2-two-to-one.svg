00 kN（2 m × 2 m 方形基腳）</text><line x1="246.09" y1="171.99" x2="308.12" y2="171.99" stroke="#1D4ED8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><line x1="246.09" y1="182.84" x2="246.09" y2="168.88" stroke="#1D4ED8" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 3" opacity="1.0"/><line x1="308.12" y1="182.84" x2="308.12" y2="168.88" stroke="#1D4ED8" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 3" opacity="1.0"/><rect x="183.33333333333331" y="159.7355072463768" width="61.00000000000001" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="238.33" y="171.99" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">B = 2 m</text><line x1="246.09" y1="201.45" x2="98.77" y2="496.09" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="9 5" opacity="1.0"/><line x1="308.12" y1="201.45" x2="455.43" y2="496.09" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="9 5" opacity="1.0"/><polygon points="246.09,201.45 308.12,201.45 455.43,496.09 98.77,496.09" fill="rgba(180,83,9,0.10)" stroke="none" stroke-width="1" opacity="1.0"/><line x1="371.70" y1="229.36" x2="402.71" y2="229.36" stroke="#B45309" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><line x1="402.71" y1="229.36" x2="402.71" y2="291.39" stroke="#B45309" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><text x="387.20" y="217.36" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">1</text><text x="414.71" y="260.38" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">2</text><line x1="145.29" y1="403.04" x2="408.91" y2="403.04" stroke="#2E7D6F" stroke-width="3.0" stroke-linecap="round" opacity="1.0"/><circle cx="277.10" cy="403.04" r="6.2" fill="#2E7D6F" stroke="#FFFFFF" stroke-width="2.0"/><line x1="145.29" y1="429.41" x2="145.29" y2="429.41" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="408.91" y1="429.41" x2="408.91" y2="429.41" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="145.29" y1="429.41" x2="408.91" y2="429.41" stroke="#2E7D6F" stroke-width="1.2"/><polygon points="145.29,429.41 153.29,432.61 153.29,426.21" fill="#2E7D6F"/><polygon points="408.91,429.41 400.91,426.21 400.91,432.61" fill="#2E7D6F"/><text x="277.10" y="449.41" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">B + z' = 8.5 m</text><line x1="229.03" y1="201.45" x2="229.03" y2="201.45" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="229.03" y1="403.04" x2="229.03" y2="403.04" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="229.03" y1="201.45" x2="229.03" y2="403.04" stroke="#B45309" stroke-width="1.2"/><polygon points="229.03,201.45 225.83,209.45 232.23,209.45" fill="#B45309"/><polygon points="229.03,403.04 232.23,395.04 225.83,395.04" fill="#B45309"/><text x="275.03" y="302.25" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">z' = 6.5 m</text><rect x="153.5014492753623" y="368.04347826086956" width="247.20000000000007" height="26" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="184.47" y="381.04" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">Δσ<tspan dy="4.20" font-size="9.52">z</tspan><tspan dy="-4.20" font-size="14"> = 1200 / 8.5² = 16.61 kPa</tspan></text><line x1="191.81" y1="310.00" x2="362.39" y2="310.00" stroke="#6B7684" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="362.39" y1="310.00" x2="475.59" y2="310.00" stroke="#6B7684" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><rect x="475.7971014492754" y="297.75" width="148.25" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="481.80" y="310.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">黏土頂 Δσ = 39.7 kPa</text><line x1="98.77" y1="496.09" x2="455.43" y2="496.09" stroke="#6B7684" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4 4" opacity="1.0"/><line x1="455.43" y1="496.09" x2="475.59" y2="496.09" stroke="#6B7684" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 3" opacity="1.0"/><rect x="475.7971014492754" y="483.8369565217391" width="141.25" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="481.80" y="496.09" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">黏土底 Δσ = 9.1 kPa</text><rect x="475.7971014492754" y="390.79347826086956" width="135.5" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="481.80" y="403.04" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">中點 Δσ = 16.6 kPa</text><text x="470.00" y="30.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 2　2:1 分散法的深度 z' 從「基礎底面」起算，不是從地表</text><text x="470.00" y="54.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">水平 1 : 垂直 2，作用面積由 B×L 擴大為 (B+z')(L+z')</text><text x="470.00" y="572.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">攔錯用：若把 z 誤取為地表起算的 8 m，(2+8)² = 100 m²，Δσ 只剩 12.00 kPa，少了 28%。</text><text x="470.00" y="598.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">另注意黏土層厚 6 m 是基礎寬 2 m 的 3 倍，頂底 Δσ 相差 40 ÷ 9 ≈ 4.4 倍，取中點只是考試簡化。</text></svg>