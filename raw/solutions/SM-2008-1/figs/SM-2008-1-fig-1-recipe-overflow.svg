ans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">乙借土區</text><text x="400.00" y="518.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">V = 0.221 m³　ω = 11%</text><text x="331.44" y="540.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">W<tspan dy="3.60" font-size="8.16">s</tspan><tspan dy="-3.60" font-size="12"> = 4.102，W</tspan><tspan dy="3.60" font-size="8.16">t</tspan><tspan dy="-3.60" font-size="12"> = 4.553 kN</tspan></text><rect x="257.27" y="174.26314876048156" width="95.46000000000001" height="25" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="305.00" y="186.76" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">體積比 4 : 1</text><line x1="465.00" y1="320.00" x2="640.00" y2="320.00" stroke="#3F4A5A" stroke-width="3.0" stroke-linecap="round"/><polygon points="640.0,320.0 627.0,313.0 627.0,327.0" fill="#3F4A5A"/><rect x="493.46" y="281.5" width="118.08000000000001" height="25" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="552.50" y="294.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#3F4A5A" text-anchor="middle" dominant-baseline="middle" font-weight="700">混合＋加水＋滾壓</text><rect x="490.125" y="333.75" width="124.75" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="552.50" y="346.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">乾土重 20 kN 守恆</text><rect x="670.0" y="240.07631612012162" width="180" height="229.92368387987838" rx="0" fill="rgba(63,74,90,0.30)" stroke="#3F4A5A" stroke-width="1.8"/><text x="717.29" y="355.04" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="400">土粒 V<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 0.766</tspan></text><rect x="670.0" y="166.6818207072776" width="180" height="73.39449541284402" rx="0" fill="rgba(29,78,216,0.30)" stroke="#1D4ED8" stroke-width="1.8"/><text x="723.54" y="203.38" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">水 V<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5"> = 0.245</tspan></text><text x="760.00" y="496.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">夯實目標 1 m³</text><text x="717.08" y="518.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.60" font-size="8.16">d</tspan><tspan dy="-3.60" font-size="12"> = 20，ω = 12%</tspan></text><line x1="610.00" y1="170.00" x2="910.00" y2="170.00" stroke="#C0392B" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="9 5"/><rect x="910.0" y="157.5" width="101.44000000000001" height="25" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="916.00" y="170.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">1 m³ 的天花板</text><line x1="864.00" y1="170.00" x2="864.00" y2="166.68" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round"/><polygon points="864.0,170.0 859.0,161.0 869.0,161.0" fill="#C0392B"/><polygon points="864.0,166.7 859.0,175.7 869.0,175.7" fill="#C0392B"/><rect x="545.5" y="156.09091035363878" width="114.5" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="654.00" y="168.34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">超出 0.01106 m³</text><rect x="670.84" y="127.93182070727755" width="178.32000000000002" height="25.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="700.15" y="140.68" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">V<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> + V</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = 1.01106 m³</tspan></text><text x="540.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　配方算得出來，但夯實目標塞不進 1 m³</text><text x="307.29" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">所有方塊高度依實際體積等比繪製（1 m³ = 300 px）；土粒體積由各區自己的 G<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> 換算</tspan></text><text x="345.27" y="592.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">V<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> = W</tspan><tspan dy="4.05" font-size="9.18">sA</tspan><tspan dy="-4.05" font-size="13.5">/(G</tspan><tspan dy="4.05" font-size="9.18">sA</tspan><tspan dy="-4.05" font-size="13.5"> γ</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">) + W</tspan><tspan dy="4.05" font-size="9.18">sB</tspan><tspan dy="-4.05" font-size="13.5">/(G</tspan><tspan dy="4.05" font-size="9.18">sB</tspan><tspan dy="-4.05" font-size="13.5"> γ</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">) = 0.61154 + 0.15487 = 0.76641 m³</tspan></text><text x="335.56" y="618.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">V<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = W</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/γ</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = 2.4/9.81 = 0.24465 m³　⇒　V</tspan><tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> + V</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = 1.01106 m³ ＞ 1 m³</tspan></text><text x="344.12" y="646.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">換算成飽和度 S = ωG<tspan dy="3.90" font-size="8.84">s,mix</tspan><tspan dy="-3.90" font-size="13">/e = 104.7%（G</tspan><tspan dy="3.90" font-size="8.84">s,mix</tspan><tspan dy="-3.90" font-size="13"> = 2.6601，e = 0.3048）</tspan></text><text x="302.18" y="674.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">攔錯用：三個小題的算術完全用不到 G<tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13">，但沒有 G</tspan><tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13"> 就看不出目標狀態不可能達成。</tspan></text><text x="540.00" y="700.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">考卷卷首寫著「倘若條件不足，請自行合理假設」——把這個矛盾指出來是加分而非扣分。</text></svg>