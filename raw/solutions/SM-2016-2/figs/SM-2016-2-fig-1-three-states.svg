1</tspan></text><rect x="674.0" y="244.51136" width="132" height="33.488640000000004" rx="0" fill="rgba(29,78,216,0.22)" stroke="#1D4ED8" stroke-width="1.8"/><text x="740.00" y="261.26" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="400">水</text><rect x="674.0" y="219.40797538461536" width="132" height="25.10338461538463" rx="0" fill="rgba(0,0,0,0.05)" stroke="#6B7684" stroke-width="1.8"/><text x="740.00" y="231.96" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">空氣</text><text x="740.00" y="456.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">夯實後填方</text><text x="740.00" y="478.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">含水量改為 OMC = 8%</text><text x="740.00" y="199.41" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">e = 0.3855</text><text x="691.68" y="177.41" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">γ<tspan dy="3.90" font-size="8.84">d</tspan><tspan dy="-3.90" font-size="13"> = 19.50 kN/m³</tspan></text><text x="657.83" y="500.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">S = 57.2%　（V<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5">/V</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 0.220）</tspan></text><line x1="180.00" y1="278.00" x2="820.00" y2="278.00" stroke="#3F4A5A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="820.0" y="265.75" width="114.0" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="826.00" y="278.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">土粒體積永遠不變</text><line x1="332.00" y1="334.00" x2="428.00" y2="334.00" stroke="#B45309" stroke-width="2.0" stroke-linecap="round"/><polygon points="428.0,334.0 418.0,329.0 418.0,339.0" fill="#B45309"/><rect x="323.0" y="303.75" width="114.0" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="380.00" y="316.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">容器裡比現地還鬆</text><line x1="572.00" y1="334.00" x2="668.00" y2="334.00" stroke="#B45309" stroke-width="2.0" stroke-linecap="round"/><polygon points="668.0,334.0 658.0,329.0 658.0,339.0" fill="#B45309"/><rect x="563.0" y="303.75" width="114.0" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="620.00" y="316.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">夯實後才真正變緊</text><text x="500.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　三種狀態的三相組成：只有土粒那一格是共通的</text><text x="500.00" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">柱高 = 1 + e（以土粒體積為 1 正規化）；含水量在前兩格相同（密封送驗），第三格才改為 OMC</text><text x="500.00" y="554.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">攔錯用：實驗室容器內的 e = 0.70 是「重新填入」造成的狀態，比現地的 e = 0.6244 還鬆。</text><text x="271.50" y="580.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">它只能用來反推比重 G<tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13">（材質常數，不隨鬆緊改變），不能拿來當現地孔隙比。</tspan></text><text x="247.54" y="608.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">若誤把 e = 0.70 當現地值，會得 γ<tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = 15.89 而非 16.63，第三小題的借土量會多算 545 m³。</tspan></text><text x="366.47" y="636.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">G<tspan dy="4.20" font-size="9.52">s</tspan><tspan dy="-4.20" font-size="14"> = ρ</tspan><tspan dy="4.20" font-size="9.52">d,lab</tspan><tspan dy="-4.20" font-size="14"> (1+e) / ρ</tspan><tspan dy="4.20" font-size="9.52">w</tspan><tspan dy="-4.20" font-size="14"> = 1.62 × 1.70 = 2.754</tspan></text></svg>