oft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">i = ΔH / L = 0.3684　；　i<tspan dy="3.60" font-size="8.16">c</tspan><tspan dy="-3.60" font-size="12"> = (γ</tspan><tspan dy="3.60" font-size="8.16">t</tspan><tspan dy="-3.60" font-size="12"> − γ</tspan><tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12">)/γ</tspan><tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12"> = 0.86</tspan></text><text x="666.20" y="198.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">FS = i<tspan dy="3.60" font-size="8.16">c</tspan><tspan dy="-3.60" font-size="12"> / i = 2.33　（安全）</tspan></text><rect x="654.2" y="221.19999999999993" width="424" height="86" rx="8" fill="#FFFFFFF2" stroke="#2E7D6F" stroke-width="1.5"/><text x="666.20" y="237.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">(三) 上舉（土湧）　受壓水頭由 GL−1.0 m 傳到 SM 層頂</text><text x="666.20" y="257.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">h<tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12"> = 10.32 − 1.0 = 9.32 m　U = γ</tspan><tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12"> h</tspan><tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12"> = 9.32 tf/m²</tspan></text><text x="666.20" y="277.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">FS = W / U = 4.315 / 9.32 = 0.46　（極不安全）</text><text x="666.20" y="297.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">欲得 FS = 2，坑內水位須降到 GL−8.16 m</text><rect x="654.2" y="319.99999999999994" width="424" height="86" rx="8" fill="#FFFFFFF2" stroke="#B45309" stroke-width="1.5"/><text x="666.20" y="336.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">(四) 隆起　FS = S<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5">·N</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> / (γH + q)，N</tspan><tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> = π + 2 = 5.1416</tspan></text><text x="666.20" y="356.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">γH（GL 0 ~ 8.0 m 逐層累加）= 14.392 tf/m²</text><text x="666.20" y="376.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">N<tspan dy="3.60" font-size="8.16">avg</tspan><tspan dy="-3.60" font-size="12"> = (4×2.32 + 13.333×3.68)/6.0 = 9.724</tspan></text><text x="666.20" y="396.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">S<tspan dy="3.60" font-size="8.16">u</tspan><tspan dy="-3.60" font-size="12"> = 10N/16 = 6.078 tf/m²　⇒　FS = 2.03　（安全）</tspan></text><line x1="1115.90" y1="121.20" x2="1115.90" y2="121.20" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="1115.90" y1="425.20" x2="1115.90" y2="425.20" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="1115.90" y1="121.20" x2="1115.90" y2="425.20" stroke="#8A94A6" stroke-width="1.2"/><polygon points="1115.90,121.20 1112.70,129.20 1119.10,129.20" fill="#8A94A6"/><polygon points="1115.90,425.20 1119.10,417.20 1112.70,417.20" fill="#8A94A6"/><text x="1161.90" y="273.20" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">H = 8.0 m</text><line x1="1115.90" y1="425.20" x2="1115.90" y2="425.20" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="1115.90" y1="653.20" x2="1115.90" y2="653.20" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="1115.90" y1="425.20" x2="1115.90" y2="653.20" stroke="#8A94A6" stroke-width="1.2"/><polygon points="1115.90,425.20 1112.70,433.20 1119.10,433.20" fill="#8A94A6"/><polygon points="1115.90,653.20 1119.10,645.20 1112.70,645.20" fill="#8A94A6"/><text x="1161.90" y="539.20" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">D = 6.0 m</text></g><text x="670.0" y="920" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">三個檢核用的是三個不同的面：管湧沿壁面、上舉在 CL/SM 交界、隆起繞過壁底。</text></svg>