ze="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = ρ</tspan><tspan dy="3.75" font-size="8.5">t</tspan><tspan dy="-3.75" font-size="12.5">/(1+ω)、γ</tspan><tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = 9.81ρ</tspan><tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> 逐點算出</tspan></text><text x="450.00" y="520.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">三點二次內插：(7.8, 9.7, 12.9) → (10.93%, 18.15)　；(9.7, 12.9, 13.8) → (10.86%, 18.11)　；四點最小二乘 → (10.98%, 18.14)</text><text x="281.74" y="546.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">三種取法一致收斂 ⇒ 取 OMC ≈ 10.9%、γ<tspan dy="4.05" font-size="9.18">d,max</tspan><tspan dy="-4.05" font-size="13.5"> ≈ 18.1 kN/m³</tspan></text><text x="450.00" y="578.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">攔錯用：左半支斜率 +0.42 /% 遠陡於右半支 −0.07 /%，峰值必偏左且高於實測最大值 18.00。</text><text x="222.95" y="602.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">若直接把 (9.7%, 18.00) 當答案，OMC 低估 1.2 個百分點、γ<tspan dy="3.75" font-size="8.5">d,max</tspan><tspan dy="-3.75" font-size="12.5"> 低估 0.1 kN/m³。</tspan></text></svg>