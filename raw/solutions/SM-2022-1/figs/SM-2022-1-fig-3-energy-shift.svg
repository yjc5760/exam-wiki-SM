ns-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">物理原因：能量大時，較低含水量即可克服土粒間摩擦而重排；記成「右下移」是最常見的失分。</text></svg>