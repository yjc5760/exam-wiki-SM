nt-baseline="middle" font-weight="700">V = 440 ml</text><text x="770.00" y="203.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">e = 0.3976</text><text x="723.54" y="500.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = 18.95 kN/m³</tspan></text><line x1="81.00" y1="297.78" x2="841.00" y2="297.78" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="76.5" y="285.52777777777777" width="142.5" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="111.08" y="297.78" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">V<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 314.8 ml 固定</tspan></text><line x1="989.00" y1="161.20" x2="989.00" y2="245.20" stroke="#B45309" stroke-width="3.0" stroke-linecap="round"/><line x1="982.00" y1="161.20" x2="996.00" y2="161.20" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><text x="1003.00" y="161.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">0%</text><line x1="982.00" y1="169.60" x2="996.00" y2="169.60" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="178.00" x2="996.00" y2="178.00" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="186.40" x2="996.00" y2="186.40" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="194.80" x2="996.00" y2="194.80" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="203.20" x2="996.00" y2="203.20" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><text x="1003.00" y="203.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">50%</text><line x1="982.00" y1="211.60" x2="996.00" y2="211.60" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="220.00" x2="996.00" y2="220.00" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="228.40" x2="996.00" y2="228.40" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="236.80" x2="996.00" y2="236.80" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><line x1="982.00" y1="245.20" x2="996.00" y2="245.20" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/><text x="1003.00" y="245.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">100%</text><text x="968.50" y="135.20" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">D<tspan dy="3.90" font-size="8.84">r</tspan><tspan dy="-3.90" font-size="13"> 標尺</tspan></text><line x1="530.00" y1="220.00" x2="989.00" y2="220.00" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="989.00" cy="220.00" r="7.0" fill="#B45309" stroke="#FFFFFF" stroke-width="2.4"/><rect x="1029.0" y="207.25" width="80.04" height="25.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="1035.00" y="220.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">D<tspan dy="4.05" font-size="9.18">r</tspan><tspan dy="-4.05" font-size="13.5"> = 70%</tspan></text><line x1="353.00" y1="161.20" x2="979.00" y2="161.20" stroke="#6B7684" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="593.00" y1="220.00" x2="979.00" y2="220.00" stroke="#6B7684" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="833.00" y1="245.20" x2="979.00" y2="245.20" stroke="#6B7684" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><text x="560.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　三個狀態的土粒體積完全相同，只有孔隙在變</text><text x="560.00" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">柱高即題目給的總體積（640 / 500 / 440 ml），灰色底座是同一塊 314.8 ml 的土粒</text><text x="343.54" y="578.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">因為 V<tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13"> 固定，e = (V − V</tspan><tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13">)/V</tspan><tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13"> 對 V 是線性的，兩種算法必然給同一個答案：</tspan></text><text x="330.86" y="604.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">體積法　D<tspan dy="4.20" font-size="9.52">r</tspan><tspan dy="-4.20" font-size="14"> = (V</tspan><tspan dy="4.20" font-size="9.52">m</tspan><tspan dy="-4.20" font-size="14">ax − V)/(V</tspan><tspan dy="4.20" font-size="9.52">m</tspan><tspan dy="-4.20" font-size="14">ax − V</tspan><tspan dy="4.20" font-size="9.52">m</tspan><tspan dy="-4.20" font-size="14">in) = (640 − 500)/(640 − 440) = 0.700</tspan></text><text x="280.18" y="630.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">孔隙比法　D<tspan dy="4.20" font-size="9.52">r</tspan><tspan dy="-4.20" font-size="14"> = (e</tspan><tspan dy="4.20" font-size="9.52">m</tspan><tspan dy="-4.20" font-size="14">ax − e)/(e</tspan><tspan dy="4.20" font-size="9.52">m</tspan><tspan dy="-4.20" font-size="14">ax − e</tspan><tspan dy="4.20" font-size="9.52">m</tspan><tspan dy="-4.20" font-size="14">in) = (1.0329 − 0.5882)/(1.0329 − 0.3976) = 0.700</tspan></text><text x="285.00" y="658.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">攔錯用：體積最大＝最疏鬆＝D<tspan dy="3.90" font-size="8.84">r</tspan><tspan dy="-3.90" font-size="13"> 0%，體積最小＝最緊密＝D</tspan><tspan dy="3.90" font-size="8.84">r</tspan><tspan dy="-3.90" font-size="13"> 100%——鬆緊一旦搞反，答案變 30%。</tspan></text><text x="299.83" y="682.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">注意標尺是等距的（D<tspan dy="3.75" font-size="8.5">r</tspan><tspan dy="-3.75" font-size="12.5"> 對 V 線性），但 γ</tspan><tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> 那一列的間距並不等距（13.03 → 16.68 → 18.95）。</tspan></text></svg>