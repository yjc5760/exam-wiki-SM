<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#FFFFFF"/><rect x="195.0" y="241.11111111111111" width="210" height="188.88888888888889" rx="0" fill="rgba(63,74,90,0.30)" stroke="#3F4A5A" stroke-width="1.8"/><rect x="195.0" y="211.11111111111111" width="210" height="30.0" rx="0" fill="rgba(29,78,216,0.24)" stroke="#1D4ED8" stroke-width="1.8"/><rect x="195.0" y="130.0" width="210" height="81.1111111111111" rx="0" fill="rgba(0,0,0,0.05)" stroke="#6B7684" stroke-width="1.8"/><line x1="409.00" y1="335.56" x2="421.00" y2="335.56" stroke="#3F4A5A" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><text x="429.00" y="323.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">土粒 V<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> = 314.8 ml</tspan></text><text x="429.00" y="345.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">W<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 850 g</tspan></text><line x1="409.00" y1="226.11" x2="421.00" y2="226.11" stroke="#1D4ED8" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><text x="429.00" y="214.11" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">水 V<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = 50 ml</tspan></text><text x="429.00" y="236.11" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">W<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5"> = 50 g</tspan></text><line x1="409.00" y1="170.56" x2="421.00" y2="170.56" stroke="#6B7684" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><text x="429.00" y="158.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">空氣 V<tspan dy="4.05" font-size="9.18">a</tspan><tspan dy="-4.05" font-size="13.5"> = 135.2 ml</tspan></text><text x="429.00" y="180.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">重量 = 0</text><line x1="175.00" y1="241.11" x2="175.00" y2="130.00" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><line x1="175.00" y1="241.11" x2="185.00" y2="241.11" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><line x1="175.00" y1="130.00" x2="185.00" y2="130.00" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="120.43" y="173.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">孔隙 V<tspan dy="4.05" font-size="9.18">v</tspan></text><text x="163.00" y="195.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="400">= 185.19 ml</text><text x="300.00" y="456.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">現地取樣 500 ml</text><text x="256.51" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">圖 2　由飽和度倒推土粒體積，順手驗出 G<tspan dy="5.25" font-size="11.9">s</tspan><tspan dy="-5.25" font-size="17.5"> = 2.70</tspan></text><text x="450.00" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">三段高度依實際體積等比繪製（1 ml = 0.6 px）</text><text x="194.88" y="478.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">V<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = W</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/γ</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = 50 ml　→　V</tspan><tspan dy="4.05" font-size="9.18">v</tspan><tspan dy="-4.05" font-size="13.5"> = V</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/S = 50/0.27 = 185.19 ml　→　V</tspan><tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> = 500 − V</tspan><tspan dy="4.05" font-size="9.18">v</tspan><tspan dy="-4.05" font-size="13.5"> = 314.81 ml</tspan></text><text x="325.39" y="506.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">G<tspan dy="4.50" font-size="10.2">s</tspan><tspan dy="-4.50" font-size="15"> = W</tspan><tspan dy="4.50" font-size="10.2">s</tspan><tspan dy="-4.50" font-size="15">/(V</tspan><tspan dy="4.50" font-size="10.2">s</tspan><tspan dy="-4.50" font-size="15">·γ</tspan><tspan dy="4.50" font-size="10.2">w</tspan><tspan dy="-4.50" font-size="15">) = 850/314.81 = 2.700</tspan></text><text x="450.00" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">這個 2.70 是資料自洽性的檢核：若算出 2.2 或 3.1，代表題目數據或計算有問題。</text><text x="256.68" y="562.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">攔錯用：V<tspan dy="3.90" font-size="8.84">v</tspan><tspan dy="-3.90" font-size="13"> = V</tspan><tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> / S，不是 V</tspan><tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> × S。S = 27% 代表孔隙只有 27% 裝水，</tspan></text><text x="159.87" y="586.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">所以孔隙比水多得多（185.19 ml vs 50 ml）；乘除顛倒會得 V<tspan dy="3.75" font-size="8.5">v</tspan><tspan dy="-3.75" font-size="12.5"> = 13.5 ml，V</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> 變成 486.5 ml、G</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 1.75。</tspan></text><text x="234.54" y="608.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">本題給的 S、W、W<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> 對「體積法」是冗餘資訊，但正是它們讓這張驗證圖成立。</tspan></text></svg>