<!DOCTYPE html>

<head>

<title>SM-2003-3 開挖基盤隆起臨界深度</title>
<style>
  body { margin:0; padding:12px; background:#fafafa; display:flex; justify-content:center; }

  svg { display:block; width:580px; height:auto; }
</style>
</head>
<body>
<div class="card">
<svg viewBox="0 0 580 244" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">
<rect x="0" y="0" width="580" height="244" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1a1a1a">開挖基盤隆起臨界深度</text>
<text x="20" y="52" font-size="12.5" fill="#666">有效應力歸零判斷法</text>
<line x1="20" y1="62" x2="560" y2="62" stroke="#e0e0e0" stroke-width="1"/>

<rect x="190" y="78" width="360.0" height="34" rx="4" fill="#12B886" opacity="0.88"/>

<rect x="190" y="126" width="2.0" height="34" rx="4" fill="#4C6EF5" opacity="0.88"/>

<line x1="190" y1="74" x2="190" y2="166" stroke="#999" stroke-width="1"/>
<foreignObject x="20" y="184" width="540" height="60">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#555;line-height:1.5;font-family:sans-serif;">當總應力等於孔隙水壓（σ'=0）時即達臨界隆起狀態，對應最大開挖深度6.076m</div>
</foreignObject>
