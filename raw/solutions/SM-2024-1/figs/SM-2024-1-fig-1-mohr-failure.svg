 Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="400" font-style="italic">(166.77, 107.55)</text><polyline points="377.71,291.63 383.92,304.18 371.37,310.39" fill="none" stroke="#6B7684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="365.16" y1="427.34" x2="365.16" y2="297.84" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="1.0"/><line x1="164.35" y1="297.84" x2="365.16" y2="297.84" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="1.0"/><text x="291.32" y="386.40" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">ff</tspan><tspan dy="-3.75" font-size="12.5"> = 166.77</tspan></text><text x="172.35" y="284.84" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">τ<tspan dy="3.75" font-size="8.5">ff</tspan><tspan dy="-3.75" font-size="12.5"> = 107.55</tspan></text></g><g transform="translate(680,76)" clip-path="url(#sdclip1)"><rect width="680" height="660" fill="#FFFFFF"/><rect x="6" y="6" width="668" height="648" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="340.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">(二) 破壞面與最大主應力面的夾角</text><text x="340.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="midd