-width="1" stroke-dasharray="3 3"/><line x1="245.44" y1="580.28" x2="487.27" y2="580.28" stroke="#1D4ED8" stroke-width="1.2"/><polygon points="245.44,580.28 253.44,583.48 253.44,577.08" fill="#1D4ED8"/><polygon points="487.27,580.28 479.27,577.08 479.27,583.48" fill="#1D4ED8"/><text x="340.14" y="593.28" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">Δσ<tspan dy="3.90" font-size="8.84">d</tspan><tspan dy="-3.90" font-size="13"> = 240</tspan></text><line x1="346.20" y1="620.58" x2="346.20" y2="620.58" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="748.70" y1="620.58" x2="748.70" y2="620.58" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="346.20" y1="620.58" x2="748.70" y2="620.58" stroke="#2E7D6F" stroke-width="1.2"/><polygon points="346.20,620.58 354.20,623.78 354.20,617.38" fill="#2E7D6F"/><polygon points="748.70,620.58 740.70,617.38 740.70,623.78" fill="#2E7D6F"/><text x="511.09" y="633.58" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">Δσ<tspan dy="3.90" font-size="8.84">d</tspan><tspan dy="-3.90" font-size="13"> = 399.46</tspan></text><line x1="346.20" y1="663.91" x2="829.85" y2="663.91" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 5" opacity="1.0"/><line x1="829.85" y1="653.83" x2="829.85" y2="673.98" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" opacity="1.0"/><text x="588.03" y="652.91" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">錯誤做法：240 × 2 = 480</text><line x1="864" y1="108" x2="886" y2="108" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><text x="894.00" y="108.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">題給狀態  σ3' = 100</text><line x1="864" y1="134" x2="886" y2="134" stroke="#2E7D6F" stroke-width="4" stroke-linecap="round"/><text x="894.00" y="134.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">(四) 新圍壓  σ3' = 200</text><line x1="864" y1="160" x2="886" y2="160" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="894.00" y="160.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">比例外推（錯誤做法）</text><text x="864.00" y="212.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">正解（截距不為零的直線）</text><text x="864.00" y="236.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">σ1' = σ3'·Kp + 2c'·√Kp</text><text x="864.00" y="260.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">Kp = 2.5946，  2c'√Kp = 80.54</text><text x="864.00" y="308.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">圍壓 +100 只讓 σ1' 增加</text><text x="864.00" y="332.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">100 × Kp = 259.46，不是加倍。</text><text x="864.00" y="380.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">比例外推 480 高估 20.2%。</text><text x="864.00" y="428.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">只有 c' = 0（正常壓密黏土）時</text><text x="864.00" y="452.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">包絡線才過原點，Δσd 也才與</text><text x="864.00" y="476.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">圍壓成正比 —— 見 SM-2018-2。</text></svg>