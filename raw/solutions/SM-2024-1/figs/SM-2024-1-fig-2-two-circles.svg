<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720"><rect width="1180" height="720" fill="#FFFFFF"/><rect x="6" y="6" width="1168" height="708" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="590.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">SM-2024-1 圖 2　同一土壤、兩個圍壓的破壞莫爾圓</text><text x="590.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">c' ≠ 0 ⇒ 軸差應力不與圍壓成正比</text><line x1="60.05" y1="343.49" x2="845.97" y2="343.49" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="144.68" y1="667.94" x2="144.68" y2="97.64" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="843.97" y="363.49" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400" font-style="italic">σ (kPa)</text><text x="152.68" y="100.64" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">τ (kPa)</text><line x1="93.79" y1="343.49" x2="553.84" y2="115.78" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><text x="561.84" y="115.78" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">τ = 25 + σ tan 26.33°</text><circle cx="366.35" cy="343.49" r="120.91" fill="none" stroke="#1D4ED8" stroke-width="2.6" opacity="1.0"/><c