<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760"><rect width="980" height="760" fill="#FFFFFF"/><rect x="212.0" y="274.55116133082237" width="176" height="245.44883866917763" rx="0" fill="rgba(63,74,90,0.30)" stroke="#3F4A5A" stroke-width="1.8"/><text x="257.29" y="397.28" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="400">土粒 V<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 613.6</tspan></text><rect x="212.0" y="155.26302573760202" width="176" height="119.28813559322035" rx="0" fill="rgba(29,78,216,0.24)" stroke="#1D4ED8" stroke-width="1.8"/><text x="263.54" y="214.91" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">水 V<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5"> = 298.2</tspan></text><rect x="212.0" y="142.39999999999998" width="176" height="12.863025737602038" rx="0" fill="rgba(0,0,0,0.06)" stroke="#6B7684" stroke-width="1.8"/><text x="300.00" y="546.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">夯實前</text><text x="213.16" y="568.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">V = 944.0 cm³　γ<tspan dy="3.60" font-size="8.16">d</tspan><tspan dy="-3.60" font-size="12"> = 17.22 kN/m³</tspan></text><text x="300.00" y="590.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">e = 0.5384　S = 90.3%</text><line x1="212.00" y1="148.83" x2="182.00" y2="114.83" stroke="#6B7684" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="81.5" y="92.58151286880098" width="100.5" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="176.00" y="104.83" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">空氣 32.2 cm³</text><rect x="572.0" y="274.55116133082237" width="176" height="245.44883866917763" rx="0" fill="rgba(63,74,90,0.30)" stroke="#3F4A5A" stroke-width="1.8"/><text x="617.29" y="397.28" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="400">土粒 V<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 613.6</tspan></text><rect x="572.0" y="155.26302573760202" width="176" height="119.28813559322035" rx="0" fill="rgba(29,78,216,0.24)" stroke="#1D4ED8" stroke-width="1.8"/><text x="623.54" y="214.91" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">水 V<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5"> = 298.2</tspan></text><rect x="572.0" y="148.98470281164307" width="176" height="6.278322925958946" rx="0" fill="rgba(0,0,0,0.06)" stroke="#6B7684" stroke-width="1.8"/><text x="660.00" y="546.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">進一步夯實後</text><text x="573.16" y="568.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">V = 927.5 cm³　γ<tspan dy="3.60" font-size="8.16">d</tspan><tspan dy="-3.60" font-size="12"> = 17.52 kN/m³</tspan></text><text x="660.00" y="590.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">e = 0.5116　S = 95.0%</text><line x1="748.00" y1="152.12" x2="778.00" y2="118.12" stroke="#6B7684" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="778.0" y="95.87386427462252" width="100.5" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="784.00" y="108.12" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">空氣 15.7 cm³</text><line x1="200.00" y1="274.55" x2="762.00" y2="274.55" stroke="#3F4A5A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="762.0" y="262.55116133082237" width="112.32" height="24" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="768.00" y="274.55" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="400">土粒體積不變 V<tspan dy="3.60" font-size="8.16">s</tspan></text><line x1="200.00" y1="155.26" x2="762.00" y2="155.26" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="762.0" y="143.263025737602" width="198.0" height="24" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="768.00" y="155.26" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400">水體積也不變（含水量固定 18%）</text><line x1="480.00" y1="142.40" x2="480.00" y2="148.98" stroke="#B45309" stroke-width="2.6" stroke-linecap="round"/><polygon points="480.0,142.4 475.0,151.4 485.0,151.4" fill="#B45309"/><polygon points="480.0,149.0 475.0,140.0 485.0,140.0" fill="#B45309"/><line x1="480.00" y1="145.69" x2="480.00" y2="265.69" stroke="#B45309" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="408.09000000000003" y="267.1923514058215" width="143.82" height="25" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="480.00" y="279.69" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">擠掉的空氣 16.5 cm³</text><rect x="417.625" y="293.4423514058215" width="124.75" height="24.5" rx="6" fill="#FFFFFFEE" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><text x="480.00" y="305.69" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">＝ 總體積的 1.74%</text><text x="490.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　進一步夯實，被擠掉的只有空氣那一格</text><text x="490.00" y="60.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">三段高度依實際體積等比繪製（1 cm³ = 0.40 px）；土粒與水兩格前後完全相同</text><text x="490.00" y="638.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">空氣由 32.2 cm³ 減為 15.7 cm³（少了一半），飽和度才從 90.3% 升到 95%。</text><text x="490.00" y="664.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">但總體積只縮 1.74%（944 → 927.5 cm³）——因為原本空氣本來就只佔 3.4%。</text><text x="285.68" y="694.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">攔錯用：「含水量不改變」是題目明講的條件，所以 V<tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> 那一格不能動；</tspan></text><text x="272.68" y="718.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">e' 要用 S'e' = ωG<tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13"> 求，不能用「體積縮多少」去猜，更不能讓水量跟著變。</tspan></text><text x="325.33" y="744.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">驗算：V' = V<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> + e'·V</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 613.6 × (1 + 0.5116) = 927.5 cm³ ✓</tspan></text></svg>