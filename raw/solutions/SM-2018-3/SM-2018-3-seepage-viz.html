<!DOCTYPE html>

<head>

<title>SM-2018-3 流網孔隙水壓分布（b~e點）</title>
<style>

<body>
<div class="card">

<div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#555;line-height:1.5;font-family:sans-serif;">沿流線每降一個等勢降，水壓遞減 7.75 kPa，至 e 點（出口）降為 0</div>
