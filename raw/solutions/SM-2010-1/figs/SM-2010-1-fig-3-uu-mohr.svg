<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620"><rect width="1080" height="620" fill="#FFFFFF"/><rect x="6" y="6" width="1068" height="608" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="540.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">SM-2010-1 圖 3　UU 破壞時的總應力圓與有效應力圓</text><text x="540.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">總應力圓可以左右平移（隨圍壓），有效應力圓永遠停在同一處</text><line x1="63.12" y1="382.56" x2="642.56" y2="382.56" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="81.38" y1="510.31" x2="81.38" y2="99.69" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="640.56" y="402.56" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400" font-style="italic">σ (kPa)</text><text x="89.38" y="102.69" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">τ (kPa)</text><line x1="81.38" y1="382.56" x2="570.48" y2="122.50" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><text x="576.48" y="114.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">有效應力包絡線  φ' = 28°、c' = 0</text><line x1="63.12" y1="301.01" x2="638.00" y2="301.01" stroke="#2E7D6F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="8 5" opacity="1.0"/><text x="638.00" y="287.01" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">總應力包絡線  φu = 0、cu = Su = 35.75</text><circle cx="255.09" cy="382.56" r="81.56" fill="rgba(192,57,43,0.10)" stroke="#C0392B" stroke-width="2.8" opacity="1.0"/><circle cx="173.54" cy="382.56" r="4.4" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="336.65" cy="382.56" r="4.4" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.6"/><text x="101.70" y="404.56" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">3f</tspan><tspan dy="-3.75" font-size="12.5">' = 40.40</tspan></text><text x="258.31" y="404.56" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">1f</tspan><tspan dy="-3.75" font-size="12.5">' = 111.90</tspan></text><circle cx="216.80" cy="310.55" r="5.4" fill="#FFFFFF" stroke="#B45309" stroke-width="2.8"/><circle cx="276.99" cy="382.56" r="81.56" fill="rgba(63,74,90,0.07)" stroke="#3F4A5A" stroke-width="2.8" opacity="1.0"/><circle cx="195.44" cy="382.56" r="4.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="358.55" cy="382.56" r="4.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="199.44" y="426.56" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5"> = 50</tspan></text><text x="362.55" y="426.56" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5"> = 121.50</tspan></text><circle cx="276.99" cy="301.01" r="5.0" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="2.6"/><circle cx="505.12" cy="382.56" r="81.56" fill="none" stroke="#8A94A6" stroke-width="2.2" stroke-dasharray="7 5" opacity="1.0"/><circle cx="505.12" cy="301.01" r="4.6" fill="#FFFFFF" stroke="#8A94A6" stroke-width="2.2"/><text x="505.12" y="446.12" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="700">若改用 σ3 = 150，半徑仍是 35.75</text><line x1="173.54" y1="490.12" x2="186.44" y2="490.12" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="195.44,490.12 186.44,494.26 186.44,485.98" fill="#B45309"/><line x1="195.44" y1="490.12" x2="182.54" y2="490.12" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="173.54,490.12 182.54,485.98 182.54,494.26" fill="#B45309"/><text x="162.53" y="510.12" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">u<tspan dy="3.75" font-size="8.5">f</tspan><tspan dy="-3.75" font-size="12.5"> = 9.6</tspan></text><text x="540.00" y="546.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">有效應力圓（紅）與 φ' 包絡線相切 —— 破壞的真正條件；它的位置只由現地 σv' = 111.90 決定。</text><text x="263.54" y="567.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">總應力圓（灰）＝ 有效應力圓右移 u<tspan dy="3.75" font-size="8.5">f</tspan><tspan dy="-3.75" font-size="12.5"> = 9.6 kPa。改變試驗圍壓只會讓灰圓左右平移，半徑恆為 Su。</tspan></text><text x="540.00" y="588.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">所以總應力包絡線是一條水平線（φu = 0），這就是第 2 小題「Δu = 50 ⇒ σ' 不變」的圖形版本。</text></svg>