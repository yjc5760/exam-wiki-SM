<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="762" viewBox="0 0 1400 762"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="700" height="640"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="700" height="640"/></clipPath></defs><rect width="1400" height="762" fill="#FFFFFF"/><text x="700.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">SM-2018-2 圖 1　CU 試驗的總應力圓與有效應力圓，以及破壞面傾角</text><text x="700.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">σ_3 = 100、Δσ_d = 85、u_f = 67 ⇒ φ_cu = 17.35°、φ' = 34.26°、θ = 62.13°</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="700" height="640" fill="#FFFFFF"/><rect x="6" y="6" width="688" height="628" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="350.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">(二) 同一組試驗數據、兩個莫爾圓</text><text x="206.58" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">兩圓半徑相同（= S<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> = 42.5），水平相距 u</tspan><tspan dy="3.75" font-size="8.5">f</tspan><tspan dy="-3.75" font-size="12.5"> = 67 kPa</tspan></text><line x1="64.00" y1="406.00" x2="558.00" y2="406.00" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><line x1="96.00" y1="584.00" x2="96.00" y2="78.00" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="556.00" y="426.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400" font-style="italic">σ (kPa)</text><text x="104.00" y="81.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">τ (kPa)</text><line x1="96.00" y1="406.00" x2="554.00" y2="262.89" stroke="#8A94A6" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><text x="410.16" y="262.89" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#8A94A6" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">總應力包絡線  φ<tspan dy="3.75" font-size="8.5">cu</tspan><tspan dy="-3.75" font-size="12.5"> = 17.35°</tspan></text><line x1="96.00" y1="406.00" x2="548.23" y2="98.00" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><text x="554.23" y="98.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">有效應力包絡線  φ' = 34.26°</text><circle cx="381.00" cy="406.00" r="85.00" fill="rgba(63,74,90,0.07)" stroke="#3F4A5A" stroke-width="2.6" opacity="1.0"/><circle cx="381.00" cy="406.00" r="3.6" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="296.00" cy="406.00" r="4.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="466.00" cy="406.00" r="4.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="247.00" cy="406.00" r="85.00" fill="rgba(29,78,216,0.10)" stroke="#1D4ED8" stroke-width="2.6" opacity="1.0"/><circle cx="247.00" cy="406.00" r="3.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="162.00" cy="406.00" r="4.4" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="332.00" cy="406.00" r="4.4" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="355.65" cy="324.87" r="5.2" fill="#FFFFFF" stroke="#B45309" stroke-width="2.6"/><circle cx="199.15" cy="335.75" r="5.2" fill="#FFFFFF" stroke="#B45309" stroke-width="2.6"/><text x="274.04" y="454.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5"> = 100</tspan></text><text x="444.04" y="454.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5"> = 185</tspan></text><text x="140.04" y="428.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">3</tspan><tspan dy="-3.75" font-size="12.5">' = 33</tspan></text><text x="306.79" y="428.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">σ<tspan dy="3.75" font-size="8.5">1</tspan><tspan dy="-3.75" font-size="12.5">' = 118</tspan></text><line x1="162.00" y1="515.00" x2="287.00" y2="515.00" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="296.00,515.00 287.00,519.14 287.00,510.86" fill="#B45309"/><line x1="296.00" y1="515.00" x2="171.00" y2="515.00" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="162.00,515.00 171.00,510.86 171.00,519.14" fill="#B45309"/><text x="210.29" y="535.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">u<tspan dy="3.75" font-size="8.5">f</tspan><tspan dy="-3.75" font-size="12.5"> = 67</tspan></text><text x="229.00" y="553.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">整個圓左移，半徑不變</text></g><g transform="translate(700,76)" clip-path="url(#sdclip1)"><rect width="700" height="640" fill="#FFFFFF"/><rect x="6" y="6" width="688" height="628" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="350.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">(三) 破壞面與水平面的夾角</text><text x="250.04" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">必須用 φ'（有效），不是 φ<tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5">u（總）</tspan></text><polygon points="286.68,373.57 413.32,373.57 413.32,150.43 286.68,150.43" fill="rgba(63,74,90,0.07)" stroke="#3F4A5A" stroke-width="2.6" opacity="1.0"/><line x1="291.00" y1="373.57" x2="409.00" y2="150.43" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round" opacity="1.0"/><line x1="286.68" y1="348.13" x2="413.32" y2="175.87" stroke="#8A94A6" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5" opacity="1.0"/><line x1="286.68" y1="348.13" x2="429.91" y2="348.13" stroke="#6B7684" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="1.0"/><polyline points="346.98,348.13 346.94,345.78 346.80,343.43 346.57,341.08 346.25,338.75 345.84,336.43 345.34,334.13 344.75,331.85 344.07,329.60 343.30,327.38 342.45,325.18 341.51,323.02 340.49,320.90 339.39,318.82 338.20,316.79 336.94,314.80 335.60,312.86 334.19,310.98 332.70,309.16 331.14,307.39 329.52,305.69 327.83,304.05 326.08,302.47 324.27,300.97 322.40,299.54" fill="none" stroke="#8A94A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><line x1="350.00" y1="108.22" x2="350.00" y2="122.34" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><polygon points="350.00,132.34 345.40,122.34 354.60,122.34" fill="#1D4ED8"/><line x1="350.00" y1="415.78" x2="350.00" y2="401.66" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><polygon points="350.00,391.66 354.60,401.66 345.40,401.66" fill="#1D4ED8"/><text x="350.00" y="78.06" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">σ1（垂直）＝ 最大主應力</text><line x1="223.35" y1="210.74" x2="241.49" y2="210.74" stroke="#8A94A6" stroke-width="3.0" stroke-linecap="round"/><polygon points="250.49,210.74 241.49,214.88 241.49,206.60" fill="#8A94A6"/><line x1="476.65" y1="210.74" x2="458.51" y2="210.74" stroke="#8A94A6" stroke-width="3.0" stroke-linecap="round"/><polygon points="449.51,210.74 458.51,206.60 458.51,214.88" fill="#8A94A6"/><text x="217.32" y="186.62" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#8A94A6" text-anchor="end" dominant-baseline="middle" font-weight="400">σ3（側向）</text><text x="482.68" y="186.62" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#8A94A6" text-anchor="start" dominant-baseline="middle" font-weight="400">σ3（側向）</text><text x="429.91" y="364.13" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">水平面</text><text x="350.00" y="490.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">正確（紅實線）　θ = 45° + φ'/2 = 62.13°</text><text x="350.00" y="511.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="700">誤用（灰虛線）　45° + φcu/2 = 53.68°</text><text x="350.00" y="553.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">為什麼是 φ' 而不是 φcu：破壞是土粒間的摩擦滑動，</text><text x="350.00" y="574.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">摩擦力由「粒間接觸應力」＝ 有效應力決定；孔隙水不能傳遞剪力，</text><text x="350.00" y="595.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">也就決定不了破壞面往哪裡切。誤用 φcu 會把傾角低估 8.45°。</text></g><text x="700.0" y="740" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">兩圓半徑同為 S_u = 42.5 kPa，僅水平相距 u_f；包絡線因 NC 黏土 c = 0 而必過原點。</text></svg>