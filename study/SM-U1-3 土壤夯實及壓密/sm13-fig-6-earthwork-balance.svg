<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1200" height="520"/></clipPath></defs><rect width="1200" height="642" fill="#FFFFFF"/><text x="600.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">土方平衡：借土 → 運送 → 夯實，只有乾土重守恆</text><text x="600.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">本例脹縮比 V借 / V填 = 1.117，代表要挖出比填方多 11.7% 的體積</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="0" y="0" width="1200" height="520" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="216.00" y="62.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 借土區（原地）</text><text x="216.00" y="82.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">e = 0.78　w = 9%</text><rect x="56" y="123.00000000000001" width="320" height="37.107303370786504" rx="0" fill="rgba(138,148,166,0.28)" stroke="#6B7684" stroke-width="1.4"/><rect x="56" y="160.10730337078652" width="320" height="16.791573033707863" rx="0" fill="rgba(29,78,216,0.24)" stroke="#1D4ED8" stroke-width="1.4"/><rect x="56" y="176.8988764044944" width="320" height="69.10112359550561" rx="0" fill="rgba(63,74,90,0.45)" stroke="#3F4A5A" stroke-width="1.4"/><text x="174.88" y="268.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">V = 11,172 m<tspan dy="-5.60" font-size="9.52">3</tspan></text><text x="170.58" y="290.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = 14.88 kN/m</tspan><tspan dy="-5.00" font-size="8.5">3</tspan></text><text x="596.00" y="62.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 運送中（鬆方）</text><text x="596.00" y="82.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">體積變大，含水量不變</text><rect x="436" y="96.0" width="320" height="64.10730337078651" rx="0" fill="rgba(138,148,166,0.28)" stroke="#6B7684" stroke-width="1.4"/><rect x="436" y="160.1073033707865" width="320" height="16.791573033707863" rx="0" fill="rgba(29,78,216,0.24)" stroke="#1D4ED8" stroke-width="1.4"/><rect x="436" y="176.89887640449436" width="320" height="69.10112359550561" rx="0" fill="rgba(63,74,90,0.45)" stroke="#3F4A5A" stroke-width="1.4"/><text x="554.88" y="268.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">V = 13,625 m<tspan dy="-5.60" font-size="9.52">3</tspan></text><text x="550.58" y="290.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = 12.20 kN/m</tspan><tspan dy="-5.00" font-size="8.5">3</tspan></text><text x="976.00" y="62.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">③ 完成填方（夯實後）</text><text x="976.00" y="82.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">RC = 95%　w = 16%</text><rect x="816" y="135.90788206471234" width="320" height="11.139308946523613" rx="0" fill="rgba(138,148,166,0.28)" stroke="#6B7684" stroke-width="1.4"/><rect x="816" y="147.04719101123595" width="320" height="29.85168539325843" rx="0" fill="rgba(29,78,216,0.24)" stroke="#1D4ED8" stroke-width="1.4"/><rect x="816" y="176.8988764044944" width="320" height="69.10112359550563" rx="0" fill="rgba(63,74,90,0.45)" stroke="#3F4A5A" stroke-width="1.4"/><text x="934.88" y="268.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">V = 10,000 m<tspan dy="-5.60" font-size="9.52">3</tspan></text><text x="930.58" y="290.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">γ<tspan dy="3.75" font-size="8.5">d</tspan><tspan dy="-3.75" font-size="12.5"> = 16.62 kN/m</tspan><tspan dy="-5.00" font-size="8.5">3</tspan></text><line x1="32.0" y1="246.0" x2="1160.0" y2="246.0" stroke="#2E7D6F" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="32.0" y1="176.9" x2="1160.0" y2="176.9" stroke="#2E7D6F" stroke-width="1.6" stroke-dasharray="6 5"/><text x="529.96" y="211.45" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">固體體積 V<tspan dy="4.20" font-size="9.52">s</tspan><tspan dy="-4.20" font-size="14"> 三格等高</tspan></text><rect x="56" y="336" width="1080" height="52" rx="10" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="2.2"/><text x="435.75" y="354.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">三個狀態唯一守恆的量：乾土重 W<tspan dy="4.65" font-size="10.54">s</tspan><tspan dy="-4.65" font-size="15.5"> = 166,250 kN</tspan></text><text x="600.00" y="376.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">體積會變、含水量會變、單位重會變 —— 只有固體顆粒的重量不變</text><line x1="216.0" y1="302.0" x2="216.0" y2="327.0" stroke="#2E7D6F" stroke-width="2.0"/><polygon points="216.0,336.0 210.8,326.0 221.2,326.0" fill="#2E7D6F"/><line x1="596.0" y1="302.0" x2="596.0" y2="327.0" stroke="#2E7D6F" stroke-width="2.0"/><polygon points="596.0,336.0 590.8,326.0 601.2,326.0" fill="#2E7D6F"/><line x1="976.0" y1="302.0" x2="976.0" y2="327.0" stroke="#2E7D6F" stroke-width="2.0"/><polygon points="976.0,336.0 970.8,326.0 981.2,326.0" fill="#2E7D6F"/><rect x="56" y="410" width="1088" height="30" rx="6" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><rect x="56" y="410" width="7" height="30" rx="3" fill="#C0392B" stroke="none" stroke-width="1"/><text x="80.00" y="425.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">Step 1　由完成填方算總乾土重</text><text x="400.00" y="425.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">W<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = γ</tspan><tspan dy="3.75" font-size="8.5">d,填</tspan><tspan dy="-3.75" font-size="12.5"> · V</tspan><tspan dy="3.75" font-size="8.5">填</tspan><tspan dy="-3.75" font-size="12.5"> = 16.62 × 10,000 = 166,250 kN</tspan></text><rect x="56" y="446" width="1088" height="30" rx="6" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><rect x="56" y="446" width="7" height="30" rx="3" fill="#6B7684" stroke="none" stroke-width="1"/><text x="80.00" y="461.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">Step 2　用 W<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> 回推開挖體積</tspan></text><text x="400.00" y="461.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">V<tspan dy="3.75" font-size="8.5">借</tspan><tspan dy="-3.75" font-size="12.5"> = W</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> ÷ γ</tspan><tspan dy="3.75" font-size="8.5">d,借</tspan><tspan dy="-3.75" font-size="12.5"> = 166,250 ÷ 14.88 = 11,172 m</tspan><tspan dy="-5.00" font-size="8.5">3</tspan></text><rect x="56" y="482" width="1088" height="30" rx="6" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><rect x="56" y="482" width="7" height="30" rx="3" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="80.00" y="497.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">Step 3　加水量也由 W<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> 算</tspan></text><text x="400.00" y="497.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">W<tspan dy="3.75" font-size="8.5">w</tspan><tspan dy="-3.75" font-size="12.5"> = W</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5">(w</tspan><tspan dy="3.75" font-size="8.5">目標</tspan><tspan dy="-3.75" font-size="12.5"> - w</tspan><tspan dy="3.75" font-size="8.5">原</tspan><tspan dy="-3.75" font-size="12.5">) = 11,638 kN ≈ 1,186 m</tspan><tspan dy="-5.00" font-size="8.5">3</tspan></text></g><text x="600.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">千萬不要用「體積守恆」或「總重守恆」列式 —— 運送與夯實都會改變體積與含水量。先由完成填方算 Ws，再用 Ws 反推借土體積與加水量，三步都不會錯。</text></svg>