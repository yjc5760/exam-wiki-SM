<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="980" height="690" fill="#FFFFFF"/>
<text x="28.0" y="38.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="23" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">一張圖推出三條破壞條件式</text>
<line x1="28.0" y1="50.0" x2="82.0" y2="50.0" stroke="#E8734A" stroke-width="3.4" stroke-linecap="round"/>
<text x="28.0" y="72.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">圓心 C、半徑 R、包絡線切點 T — 三條公式全部是同一張圖的不同寫法</text>
