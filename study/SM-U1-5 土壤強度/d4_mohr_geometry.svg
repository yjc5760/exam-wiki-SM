<path d="M 92.0,108.0 L 95.0,115.4 L 89.0,115.4 Z" fill="#1B2A41" stroke="none"/>
<text x="654.0" y="525.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="15" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>σ&#x27;</tspan></text>
<text x="84.0" y="100.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="15" fill="#1B2A41" fill-opacity="1" text-anchor="middle" font-weight="bold"><tspan>τ</tspan></text>
