<text x="435.0" y="449.5" font-family="DejaVu Serif, Times New Roman, serif" font-size="12.5" fill="#4C6B8A" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>2θ = 90° + φ&#x27;</tspan></text>
<rect x="676.0" y="104.0" width="276.0" height="456.0" rx="8" fill="#F4F6F9" fill-opacity="1" stroke="#C8D4E3" stroke-width="1.2" stroke-opacity="1"/>
<text x="692.0" y="134.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="15" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">三條破壞條件式</text>
<rect x="690.0" y="158.0" width="248.0" height="124.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#E8734A" stroke-width="1.5" stroke-opacity="1"/>
<text x="704.0" y="184.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">① 萬能表示式</text>
<text x="704.0" y="214.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>σ&#x27;</tspan><tspan dy="3.51" font-size="9.72">1</tspan><tspan dy="-3.51" font-size="13.5"></tspan><tspan> = σ&#x27;</tspan><tspan dy="3.51" font-size="9.72">3</tspan><tspan dy="-3.51" font-size="13.5"></tspan><tspan> K</tspan><tspan dy="3.51" font-size="9.72">p</tspan><tspan dy="-3.51" font-size="13.5"></tspan><tspan> + 2c&#x27;√K</tspan><tspan dy="3.51" font-size="9.72">p</tspan><tspan dy="-3.51" font-size="13.5"></tspan></text>
<text x="704.0" y="266.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="11" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>K</tspan><tspan dy="2.86" font-size="7.92">p</tspan><tspan dy="-2.86" font-size="11"></tspan><tspan> = tan²(45° + φ&#x27;/2)</tspan></text>
<rect x="690.0" y="292.0" width="248.0" height="124.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#4C6B8A" stroke-width="1.5" stroke-opacity="1"/>
<text x="704.0" y="318.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" fill-opacity="1" text-anchor="start" font-weight="bold">② 幾何關係式</text>
<text x="704.0" y="348.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>R = C sin φ&#x27; + c&#x27; cos φ&#x27;</tspan></text>
<text x="704.0" y="400.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">由切點的垂足直接看出</text>
<rect x="690.0" y="426.0" width="248.0" height="124.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#1F7A4D" stroke-width="1.5" stroke-opacity="1"/>
<text x="704.0" y="452.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#1F7A4D" fill-opacity="1" text-anchor="start" font-weight="bold">③ NC 黏土專用</text>
<text x="704.0" y="482.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="11.8" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>sin φ&#x27; = R / C</tspan></text>
<text x="704.0" y="506.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="11.8" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>= (σ&#x27;</tspan><tspan dy="3.07" font-size="8.5">1</tspan><tspan dy="-3.07" font-size="11.8"></tspan><tspan> − σ&#x27;</tspan><tspan dy="3.07" font-size="8.5">3</tspan><tspan dy="-3.07" font-size="11.8"></tspan><tspan>) / (σ&#x27;</tspan><tspan dy="3.07" font-size="8.5">1</tspan><tspan dy="-3.07" font-size="11.8"></tspan><tspan> + σ&#x27;</tspan><tspan dy="3.07" font-size="8.5">3</tspan><tspan dy="-3.07" font-size="11.8"></tspan><tspan>)</tspan></text>
<text x="704.0" y="534.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">c&#x27; = 0、包絡線過原點才成立</text>
<rect x="28.0" y="584.0" width="620.0" height="82.0" rx="8" fill="#FCF3DC" fill-opacity="1" stroke="#B7791F" stroke-width="1.3" stroke-opacity="1"/>
<text x="46.0" y="610.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#B7791F" fill-opacity="1" text-anchor="start" font-weight="bold">手算技巧：留著 √Kp 當主線</text>
<text x="46.0" y="636.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">解出 √Kp 後直接往下一階段代，不要先轉成角度 φ&#x27; 再轉回 Kp — 可完全避開四捨五入的累積誤差。兩組試驗</text>
<text x="46.0" y="655.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">求 c&#x27;、φ&#x27; 時，把兩式相減消去 2c&#x27;√Kp，一步就得到 Kp。</text>
</svg>
