<text x="356.9" y="437.9" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#4C6B8A" fill-opacity="1" text-anchor="start" font-weight="bold">R</text>
<line x1="392.0" y1="520.0" x2="572.3" y2="520.0" stroke="#4C6B8A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
