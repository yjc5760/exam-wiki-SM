<text x="186.7" y="463.6" font-family="DejaVu Serif, Times New Roman, serif" font-size="14" fill="#E8734A" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>φ&#x27;</tspan></text>
<circle cx="392.0" cy="520.0" r="3.5" fill="#1B2A41" stroke="#1B2A41" stroke-width="1"/>
<line x1="211.7" y1="515.0" x2="211.7" y2="525.0" stroke="#1B2A41" stroke-width="1.3" stroke-linecap="round"/>
<text x="211.7" y="537.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13" fill="#1B2A41" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>σ&#x27;</tspan><tspan dy="3.38" font-size="9.36">3</tspan><tspan dy="-3.38" font-size="13"></tspan></text>
<line x1="572.3" y1="515.0" x2="572.3" y2="525.0" stroke="#1B2A41" stroke-width="1.3" stroke-linecap="round"/>
<text x="572.3" y="537.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13" fill="#1B2A41" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>σ&#x27;</tspan><tspan dy="3.38" font-size="9.36">1</tspan><tspan dy="-3.38" font-size="13"></tspan></text>
<text x="392.0" y="564.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13" fill="#4C6B8A" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>C = (σ&#x27;</tspan><tspan dy="3.38" font-size="9.36">1</tspan><tspan dy="-3.38" font-size="13"></tspan><tspan> + σ&#x27;</tspan><tspan dy="3.38" font-size="9.36">3</tspan><tspan dy="-3.38" font-size="13"></tspan><tspan>) / 2</tspan></text>
<line x1="392.0" y1="520.0" x2="301.8" y2="363.8" stroke="#4C6B8A" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 3"/>
