<path d="M 128.0,362.0 A 48.0,48.0 0 0 1 224.0,362.0 Z" fill="#DCE6F0" fill-opacity="0.25" stroke="#8098B2" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 173.0,362.0 A 93.0,93.0 0 0 1 359.0,362.0 Z" fill="#DCE6F0" fill-opacity="0.5" stroke="#1B2A41" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
