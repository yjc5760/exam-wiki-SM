<rect x="44.0" y="386.0" width="416.0" height="66.0" rx="6" fill="#F4F6F9" fill-opacity="1" stroke="#C8D4E3" stroke-width="1" stroke-opacity="1"/>
<text x="58.0" y="412.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">σ&#x27;1 = σ&#x27;3 · Kp，破壞應力與圍壓成正比；</text>
<text x="58.0" y="434.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">圍壓變 2 倍，Δσd 就變 2 倍，可直接按比例秒算。</text>
