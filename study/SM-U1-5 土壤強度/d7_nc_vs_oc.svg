<rect x="520.0" y="386.0" width="416.0" height="66.0" rx="6" fill="#F4F6F9" fill-opacity="1" stroke="#C8D4E3" stroke-width="1" stroke-opacity="1"/>
<text x="534.0" y="412.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">必須回到完整式 σ&#x27;1 = σ&#x27;3 Kp + 2c&#x27;√Kp；</text>
<text x="534.0" y="434.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">兩組試驗聯立相減消去 c&#x27; 項，才解得出 Kp。</text>
<rect x="28.0" y="484.0" width="924.0" height="182.0" rx="8" fill="#1B2A41" fill-opacity="1" stroke="#1B2A41" stroke-width="0" stroke-opacity="1"/>
