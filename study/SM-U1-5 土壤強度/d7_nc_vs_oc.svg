<text x="62.0" y="586.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>sin φ&#x27; = R / C</tspan></text>
<text x="62.0" y="624.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">正弦公式：(σ&#x27;1−σ&#x27;3)/(σ&#x27;1+σ&#x27;3)</text>
<rect x="272.5" y="534.0" width="210.5" height="114.0" rx="6" fill="#243652" fill-opacity="1" stroke="#3A5375" stroke-width="1" stroke-opacity="1"/>
<text x="286.5" y="558.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">捷徑 2</text>
<text x="286.5" y="586.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>Δσ</tspan><tspan dy="3.38" font-size="9.36">d</tspan><tspan dy="-3.38" font-size="13"></tspan><tspan> ∝ σ</tspan><tspan dy="3.38" font-size="9.36">3</tspan><tspan dy="-3.38" font-size="13"></tspan></text>
<text x="286.5" y="624.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">相似形比例法：換圍壓直接按比例</text>
<rect x="497.0" y="534.0" width="210.5" height="114.0" rx="6" fill="#243652" fill-opacity="1" stroke="#3A5375" stroke-width="1" stroke-opacity="1"/>
<text x="511.0" y="558.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">捷徑 3</text>
<text x="511.0" y="586.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="12" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>S</tspan><tspan dy="3.12" font-size="8.64">u</tspan><tspan dy="-3.12" font-size="12"></tspan><tspan> / σ&#x27;</tspan><tspan dy="3.12" font-size="8.64">v</tspan><tspan dy="-3.12" font-size="12"></tspan><tspan>0</tspan></text>
<text x="511.0" y="608.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="12" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>= sin φ&#x27;/(1 + sin φ&#x27;)</tspan></text>
<text x="511.0" y="624.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">現地不排水強度比值固定</text>
<rect x="721.5" y="534.0" width="210.5" height="114.0" rx="6" fill="#243652" fill-opacity="1" stroke="#3A5375" stroke-width="1" stroke-opacity="1"/>
<text x="735.5" y="558.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">捷徑 4</text>
<text x="735.5" y="586.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="13" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>K</tspan><tspan dy="3.38" font-size="9.36">p</tspan><tspan dy="-3.38" font-size="13"></tspan><tspan> = tan²(45° + φ&#x27;/2)</tspan></text>
<text x="735.5" y="624.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">有 Kp 就有 φ&#x27;，兩者互推不必查表</text>
