<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="980" height="690" fill="#FFFFFF"/>
<text x="28.0" y="38.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="23" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">應力路徑：為什麼 φcu 不是土壤的固有性質</text>
<line x1="28.0" y1="50.0" x2="82.0" y2="50.0" stroke="#E8734A" stroke-width="3.4" stroke-linecap="round"/>
<text x="28.0" y="72.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">CD 與 CU 走不同的路徑，卻停在同一條有效 Kf 線上；φcu 只是「總應力路徑」的終點連線</text>
<line x1="88.0" y1="452.0" x2="648.0" y2="452.0" stroke="#1B2A41" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 648.0,452.0 L 640.6,455.0 L 640.6,449.0 Z" fill="#1B2A41" stroke="none"/>
<line x1="88.0" y1="452.0" x2="88.0" y2="122.0" stroke="#1B2A41" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 88.0,122.0 L 91.0,129.4 L 85.0,129.4 Z" fill="#1B2A41" stroke="none"/>
<text x="654.0" y="457.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="15" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>p, p&#x27;</tspan></text>
<text x="80.0" y="114.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="15" fill="#1B2A41" fill-opacity="1" text-anchor="middle" font-weight="bold"><tspan>q</tspan></text>
<text x="92.0" y="512.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="12.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>p = (σ</tspan><tspan dy="3.25" font-size="9.0">1</tspan><tspan dy="-3.25" font-size="12.5"></tspan><tspan> + σ</tspan><tspan dy="3.25" font-size="9.0">3</tspan><tspan dy="-3.25" font-size="12.5"></tspan><tspan>)/2,　q = (σ</tspan><tspan dy="3.25" font-size="9.0">1</tspan><tspan dy="-3.25" font-size="12.5"></tspan><tspan> − σ</tspan><tspan dy="3.25" font-size="9.0">3</tspan><tspan dy="-3.25" font-size="12.5"></tspan><tspan>)/2</tspan></text>
<line x1="88.0" y1="452.0" x2="608.0" y2="192.0" stroke="#E8734A" stroke-width="2.6" stroke-linecap="round"/>
<text x="588.0" y="190.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#E8734A" fill-opacity="1" text-anchor="end" font-weight="bold">有效 Kf 線（tan α&#x27; = sin φ&#x27;）</text>
<path d="M 162.0,452.0 A 74.0,74.0 0 0 0 154.2,418.9" fill="none" fill-opacity="1" stroke="#E8734A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="173.6" y="435.8" font-family="DejaVu Serif, Times New Roman, serif" font-size="12.5" fill="#E8734A" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>α&#x27;</tspan></text>
<line x1="88.0" y1="452.0" x2="608.0" y2="260.4" stroke="#4C6B8A" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 4"/>
<text x="606.0" y="285.2" font-family="DejaVu Serif, Times New Roman, serif" font-size="12" fill="#4C6B8A" fill-opacity="1" text-anchor="end" font-weight="normal"><tspan>CU 總應力 Kf 線（tan α</tspan><tspan dy="3.12" font-size="8.64">c</tspan><tspan dy="-3.12" font-size="12"></tspan><tspan>u = sin φcu）</tspan></text>
<circle cx="208.0" cy="452.0" r="4.5" fill="#1B2A41" stroke="#1B2A41" stroke-width="1"/>
<line x1="208.0" y1="447.0" x2="208.0" y2="457.0" stroke="#1B2A41" stroke-width="1.3" stroke-linecap="round"/>
<text x="208.0" y="469.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="12" fill="#1B2A41" fill-opacity="1" text-anchor="middle" font-weight="normal"><tspan>p&#x27;</tspan><tspan dy="3.12" font-size="8.64">0</tspan><tspan dy="-3.12" font-size="12"></tspan></text>
<line x1="208.0" y1="452.0" x2="328.0" y2="332.0" stroke="#1F7A4D" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 328.0,332.0 L 324.1,341.2 L 318.8,335.9 Z" fill="#1F7A4D" stroke="none"/>
<text x="286.0" y="340.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1F7A4D" fill-opacity="1" text-anchor="end" font-weight="bold">CD（排水）</text>
<circle cx="328.0" cy="332.0" r="5.5" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1"/>
<line x1="208.0" y1="452.0" x2="278.0" y2="382.0" stroke="#4C6B8A" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M 278.0,382.0 L 274.5,390.3 L 269.7,385.5 Z" fill="#4C6B8A" stroke="none"/>
<circle cx="278.0" cy="382.0" r="5.0" fill="#4C6B8A" stroke="#4C6B8A" stroke-width="1"/>
<text x="284.0" y="394.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#4C6B8A" fill-opacity="1" text-anchor="start" font-weight="normal">CU 總應力路徑</text>
<path d="M 208.0,452.0 Q 222.0,412.0 228.0,382.0" fill="none" fill-opacity="1" stroke="#C0392B" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 228.0,382.0 L 229.1,391.9 L 221.9,389.9 Z" fill="#C0392B" stroke="none"/>
<circle cx="228.0" cy="382.0" r="5.5" fill="#C0392B" stroke="#C0392B" stroke-width="1"/>
<text x="216.0" y="366.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#C0392B" fill-opacity="1" text-anchor="end" font-weight="bold">CU 有效應力路徑</text>
<line x1="278.0" y1="382.0" x2="228.0" y2="382.0" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
<path d="M 228.0,382.0 L 234.5,379.4 L 234.5,384.6 Z" fill="#C0392B" stroke="none"/>
<text x="253.0" y="374.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="12.5" fill="#C0392B" fill-opacity="1" text-anchor="middle" font-weight="bold"><tspan>u</tspan><tspan dy="3.25" font-size="9.0">f</tspan><tspan dy="-3.25" font-size="12.5"></tspan></text>
<text x="338.0" y="316.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">兩個終點都落在同一條有效 Kf 線上</text>
<line x1="228.0" y1="382.0" x2="328.0" y2="332.0" stroke="#E8734A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<rect x="700.0" y="100.0" width="252.0" height="400.0" rx="8" fill="#F4F6F9" fill-opacity="1" stroke="#C8D4E3" stroke-width="1.2" stroke-opacity="1"/>
<path d="M 708.0,100.0 h -4 a 8,8 0 0 0 -8,8 v 384.0 a 8,8 0 0 0 8,8 h 4 Z" fill="#C0392B" stroke="none"/>
<text x="714.0" y="122.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="15" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">三個結論</text>
<rect x="714.0" y="146.0" width="224.0" height="108.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#E8734A" stroke-width="1.4" stroke-opacity="1"/>
<text x="726.0" y="171.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">φ&#x27; 是土的性質</text>
<text x="726.0" y="196.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">不論走哪條路徑，有效應力終點都落在</text>
<text x="726.0" y="215.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">同一條 Kf 線上。</text>
<rect x="714.0" y="264.0" width="224.0" height="108.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#C0392B" stroke-width="1.4" stroke-opacity="1"/>
<text x="726.0" y="289.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#C0392B" fill-opacity="1" text-anchor="start" font-weight="bold">φcu 是路徑的產物</text>
<text x="726.0" y="314.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">改變壓密比、加載方式，uf 就變，總應</text>
<text x="726.0" y="333.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">力終點連線的斜率跟著變。</text>
<rect x="714.0" y="382.0" width="224.0" height="108.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#4C6B8A" stroke-width="1.4" stroke-opacity="1"/>
<text x="726.0" y="407.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" fill-opacity="1" text-anchor="start" font-weight="bold">換算關係</text>
<text x="726.0" y="432.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">tan α&#x27; = sin φ&#x27;，截距 a = c&#x27; cos</text>
<text x="726.0" y="451.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">φ&#x27;；考試常要你由 Kf 線反推 c&#x27;、φ&#x27;。</text>
<rect x="28.0" y="532.0" width="924.0" height="134.0" rx="8" fill="#1B2A41" fill-opacity="1" stroke="#1B2A41" stroke-width="0" stroke-opacity="1"/>
<text x="48.0" y="562.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="14" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">Kf 線與 Mohr–Coulomb 包絡線的換算（兩者不是同一條線）</text>
<text x="48.0" y="608.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="18" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>tan α&#x27; = sin φ&#x27;</tspan></text>
<text x="48.0" y="640.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">斜率不同，別直接把 α&#x27; 當 φ&#x27; 用</text>
<text x="330.0" y="608.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="18" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>a = c&#x27; cos φ&#x27;</tspan></text>
<text x="330.0" y="640.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">截距也要換算才回到 c&#x27;</text>
<text x="600.0" y="608.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="18" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>q</tspan><tspan dy="4.68" font-size="12.96">f</tspan><tspan dy="-4.68" font-size="18"></tspan><tspan> = p&#x27;</tspan><tspan dy="4.68" font-size="12.96">f</tspan><tspan dy="-4.68" font-size="18"></tspan><tspan> sin φ&#x27; + c&#x27; cos φ&#x27;</tspan></text>
<text x="600.0" y="640.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">Kf 線的完整式，NC 時 c&#x27; = 0 直接退化</text>
</svg>
