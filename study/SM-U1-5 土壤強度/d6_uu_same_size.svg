<text x="48.0" y="600.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="17" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>S</tspan><tspan dy="4.42" font-size="12.24">u</tspan><tspan dy="-4.42" font-size="17"></tspan><tspan> = (σ</tspan><tspan dy="4.42" font-size="12.24">1</tspan><tspan dy="-4.42" font-size="17"></tspan><tspan> − σ</tspan><tspan dy="4.42" font-size="12.24">3</tspan><tspan dy="-4.42" font-size="17"></tspan><tspan>)</tspan><tspan dy="4.42" font-size="12.24">f</tspan><tspan dy="-4.42" font-size="17"></tspan><tspan> / 2 = R</tspan></text>
<text x="48.0" y="632.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">不排水剪力強度＝莫爾圓半徑</text>
<text x="378.0" y="600.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="17" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>q</tspan><tspan dy="4.42" font-size="12.24">u</tspan><tspan dy="-4.42" font-size="17"></tspan><tspan> = 2 S</tspan><tspan dy="4.42" font-size="12.24">u</tspan><tspan dy="-4.42" font-size="17"></tspan></text>
<text x="378.0" y="632.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">無圍壓壓縮試驗（σ3 = 0）</text>
<text x="600.0" y="600.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="16" fill="#1F7A4D" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>S</tspan><tspan dy="4.16" font-size="11.52">u</tspan><tspan dy="-4.16" font-size="16"></tspan><tspan> / σ&#x27;</tspan><tspan dy="4.16" font-size="11.52">v</tspan><tspan dy="-4.16" font-size="16"></tspan><tspan>0 = sin φ&#x27; / (1 + sin φ&#x27;)</tspan></text>
<text x="600.0" y="632.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">NC 黏土：現地不排水強度隨深度線性成長</text>
