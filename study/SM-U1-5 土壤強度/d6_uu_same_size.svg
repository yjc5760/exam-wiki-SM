<text x="88.0" y="492.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">圍壓增量全部被孔隙水吃掉：Δu(1) &lt; Δu(2) &lt; Δu(3)，但 σ&#x27; 完全沒變</text>
<rect x="676.0" y="104.0" width="276.0" height="386.0" rx="8" fill="#F4F6F9" fill-opacity="1" stroke="#C8D4E3" stroke-width="1.2" stroke-opacity="1"/>
