<text x="702.0" y="200.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">圍壓加上去水排不掉，Δu = Δσ3（B = 1），</text>
<text x="702.0" y="219.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">σ&#x27; 一點都沒變。</text>
<rect x="690.0" y="264.0" width="248.0" height="104.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#1B2A41" stroke-width="1.4" stroke-opacity="1"/>
<text x="702.0" y="289.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">強度鎖死</text>
<text x="702.0" y="314.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">有效應力沒變 → 抗剪強度沒變 → 每個圓的</text>
<text x="702.0" y="333.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">半徑都等於 Su。</text>
<rect x="690.0" y="378.0" width="248.0" height="104.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#4C6B8A" stroke-width="1.4" stroke-opacity="1"/>
<text x="702.0" y="403.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" fill-opacity="1" text-anchor="start" font-weight="bold">φu = 0 的意義</text>
<text x="702.0" y="428.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">這不是「土沒有摩擦角」，而是「這個試驗</text>
<text x="702.0" y="447.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">看不到摩擦角」。</text>
