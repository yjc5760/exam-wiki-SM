<rect x="660.0" y="150.0" width="278.0" height="108.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#E8734A" stroke-width="1.4" stroke-opacity="1"/>
<text x="674.0" y="176.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">圓只平移不縮放</text>
<text x="674.0" y="202.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">剪切階段 σ1、σ3 同時扣掉同一個 uf，圓心左移</text>
<text x="674.0" y="221.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">uf，半徑 R 完全不變。</text>
<rect x="660.0" y="266.0" width="278.0" height="108.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#4C6B8A" stroke-width="1.4" stroke-opacity="1"/>
<text x="674.0" y="292.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" fill-opacity="1" text-anchor="start" font-weight="bold">φcu 一定小於 φ&#x27;</text>
<text x="674.0" y="318.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">總應力圓在右邊、半徑相同，切線自然比較平。NC</text>
<text x="674.0" y="337.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">黏土常見 φcu ≈ 0.5～0.7 φ&#x27;。</text>
<rect x="660.0" y="382.0" width="278.0" height="108.0" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#1F7A4D" stroke-width="1.4" stroke-opacity="1"/>
<text x="674.0" y="408.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#1F7A4D" fill-opacity="1" text-anchor="start" font-weight="bold">兩組參數同時量到</text>
<text x="674.0" y="434.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">CU 加裝孔壓計就能同時得到 φcu（總）與 c&#x27;、</text>
<text x="674.0" y="453.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">φ&#x27;（有效），是最常考的試驗。</text>
<rect x="28.0" y="552.0" width="924.0" height="114.0" rx="8" fill="#1B2A41" fill-opacity="1" stroke="#1B2A41" stroke-width="0" stroke-opacity="1"/>
<text x="48.0" y="582.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="14" fill="#E8734A" fill-opacity="1" text-anchor="start" font-weight="bold">孔隙水壓從哪來：Skempton 孔壓參數</text>
<text x="48.0" y="622.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="18" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="bold"><tspan>Δu = B [ Δσ</tspan><tspan dy="4.68" font-size="12.96">3</tspan><tspan dy="-4.68" font-size="18"></tspan><tspan> + A (Δσ</tspan><tspan dy="4.68" font-size="12.96">1</tspan><tspan dy="-4.68" font-size="18"></tspan><tspan> − Δσ</tspan><tspan dy="4.68" font-size="12.96">3</tspan><tspan dy="-4.68" font-size="18"></tspan><tspan>) ]</tspan></text>
<text x="48.0" y="650.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">飽和土 B = 1；A 值反映剪脹傾向：NC 黏土 A ≈ 0.5～1.0（正），重壓密 OC 黏土 A 可為負。</text>
<text x="596.0" y="608.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="16" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>σ&#x27;</tspan><tspan dy="4.16" font-size="11.52">1</tspan><tspan dy="-4.16" font-size="16"></tspan><tspan> = σ</tspan><tspan dy="4.16" font-size="11.52">1</tspan><tspan dy="-4.16" font-size="16"></tspan><tspan> − u</tspan><tspan dy="4.16" font-size="11.52">f</tspan><tspan dy="-4.16" font-size="16"></tspan></text>
<text x="772.0" y="608.0" font-family="DejaVu Serif, Times New Roman, serif" font-size="16" fill="#FFFFFF" fill-opacity="1" text-anchor="start" font-weight="normal"><tspan>σ&#x27;</tspan><tspan dy="4.16" font-size="11.52">3</tspan><tspan dy="-4.16" font-size="16"></tspan><tspan> = σ</tspan><tspan dy="4.16" font-size="11.52">3</tspan><tspan dy="-4.16" font-size="16"></tspan><tspan> − u</tspan><tspan dy="4.16" font-size="11.52">f</tspan><tspan dy="-4.16" font-size="16"></tspan></text>
<text x="596.0" y="650.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#DCE6F0" fill-opacity="1" text-anchor="start" font-weight="normal">先算 u，再兩邊同扣，就從總應力世界跳到有效應力世界。</text>
