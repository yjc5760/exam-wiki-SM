<text x="655.0" y="308.3" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#E8734A" fill-opacity="1" text-anchor="end" font-weight="bold">破壞面</text>
<text x="460.0" y="468.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="bold">圓周角關係：2θ = 90° + φ&#x27;　→　θ = 45° + φ&#x27;/2</text>
<text x="460.0" y="494.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" fill-opacity="1" text-anchor="start" font-weight="normal">φ&#x27; 越大，破壞面越陡；砂土 φ&#x27;=35° → θ=62.5°，軟黏土 φ&#x27;=20° → θ=55°。</text>
<rect x="28.0" y="540.0" width="924.0" height="126.0" rx="8" fill="#FBE1DE" fill-opacity="1" stroke="#C0392B" stroke-width="1.4" stroke-opacity="1"/>
<text x="48.0" y="570.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="14" fill="#C0392B" fill-opacity="1" text-anchor="start" font-weight="bold">黃金鐵律</text>
<text x="48.0" y="598.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">問破壞面角度（或破壞面上的 σ、τ）時，一律只能用有效抗剪角 φ&#x27;。φcu 會隨加載路徑跳動，但同一個試體的實體破壞面只有一個角度——因為顆粒滑動是由有效</text>
<text x="48.0" y="620.0" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" fill-opacity="1" text-anchor="start" font-weight="normal">應力控制的。題目若只給 φcu，必須先透過 uf 換算出 φ&#x27; 再代入。</text>
</svg>
