<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah_4C6B8A_10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.0" markerHeight="6.0" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6B8A"/></marker></defs><rect x="0" y="0" width="980" height="690" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="980.0" height="4.0" rx="0.0" fill="#E8734A" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="26.0" y="40.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="25.0" fill="#1B2A41" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">對策題怎麼答：先看插深有沒有用，再照「先降驅動、後升抵抗」排序</text><text x="26.0" y="66.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14.5" fill="#4C6B8A" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">同一句「加深連續壁」，在三種破壞模式下的分數完全不同</text><rect x="24.0" y="88.0" width="452.0" height="468.0" rx="8.0" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1.20" opacity="1.00"/><text x="38.0" y="116.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="14.5" fill="#1B2A41" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">「加深貫入深度」的有效性</text><text x="42.0" y="166.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#1E8449" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">砂湧 / 管湧</text><rect x="42.0" y="178.0" width="300.0" height="18.0" rx="9.0" fill="#E8EDF2" stroke="none" stroke-width="0.00" opacity="1.00"/><rect x="42.0" y="178.0" width="276.0" height="18.0" rx="9.0" fill="#1E8449" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="352.0" y="192.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1E8449" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">有效</text><text x="42.0" y="220.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">拉長滲流路徑 L，直接降低 i<tspan dy="3.4" font-size="8.3">exit</tspan><tspan dy="-3.4" font-size="11.5">​</tspan></text><text x="42.0" y="266.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#2E6DA4" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">擋土壁結構穩定</text><rect x="42.0" y="278.0" width="300.0" height="18.0" rx="9.0" fill="#E8EDF2" stroke="none" stroke-width="0.00" opacity="1.00"/><rect x="42.0" y="278.0" width="216.0" height="18.0" rx="9.0" fill="#2E6DA4" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="352.0" y="292.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#2E6DA4" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">有效</text><text x="42.0" y="320.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">被動抵抗隨 D 成長（黏土 N<tspan dy="3.4" font-size="8.3">s</tspan><tspan dy="-3.4" font-size="11.5">​</tspan>&gt;4 除外）</text><text x="42.0" y="366.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#E8734A" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">基盤隆起</text><rect x="42.0" y="378.0" width="300.0" height="18.0" rx="9.0" fill="#E8EDF2" stroke="none" stroke-width="0.00" opacity="1.00"/><rect x="42.0" y="378.0" width="78.0" height="18.0" rx="9.0" fill="#E8734A" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="352.0" y="392.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">幾乎無效</text><text x="42.0" y="420.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">破壞面繞過壁底，只微幅拉長滑動面</text><text x="42.0" y="466.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">受壓水上舉</text><rect x="42.0" y="478.0" width="300.0" height="18.0" rx="9.0" fill="#E8EDF2" stroke="none" stroke-width="0.00" opacity="1.00"/><rect x="42.0" y="478.0" width="12.0" height="18.0" rx="9.0" fill="#C0392B" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="352.0" y="492.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">完全無效</text><text x="42.0" y="520.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">改變不了 h<tspan dy="3.4" font-size="8.3">w</tspan><tspan dy="-3.4" font-size="11.5">​</tspan>，也切不斷水壓</text><rect x="494.0" y="88.0" width="462.0" height="468.0" rx="8.0" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1.20" opacity="1.00"/><text x="508.0" y="116.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="14.5" fill="#1B2A41" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">對策的作答順序：成本由低到高</text><line x1="524.0" y1="508.0" x2="524.0" y2="150.0" stroke="#4C6B8A" stroke-width="1.60" marker-end="url(#ah_4C6B8A_10)"/><text x="512.0" y="330.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.0" fill="#4C6B8A" text-anchor="end" font-weight="400" font-style="normal" opacity="1.00" transform="rotate(-90.0 512.0 330.0)">成本 ↑</text><rect x="546.0" y="440.0" width="392.0" height="78.0" rx="8.0" fill="#F4F6F9" stroke="none" stroke-width="0.00" opacity="1.00"/><rect x="546.0" y="440.0" width="6.0" heigh