 x="100.0" y="341.5" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="end" font-weight="400" font-style="normal" opacity="1.00">2</text><line x1="106.0" y1="462.5" x2="114.0" y2="462.5" stroke="#4C6B8A" stroke-width="1.00" stroke-linecap="round" opacity="1.00"/><text x="100.0" y="466.5" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="end" font-weight="400" font-style="normal" opacity="1.00">-2</text><line x1="106.0" y1="525.0" x2="114.0" y2="525.0" stroke="#4C6B8A" stroke-width="1.00" stroke-linecap="round" opacity="1.00"/><text x="100.0" y="529.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="end" font-weight="400" font-style="normal" opacity="1.00">-4</text><polygon points="345.0,275.0 580.0,275.0 580.0,525.0 345.0,525.0" fill="#C0392B" stroke="none" stroke-width="0.00" stroke-linejoin="round" opacity="0.07"/><line x1="110.0" y1="275.0" x2="580.0" y2="525.0" stroke="#E8734A" stroke-width="3.20" stroke-linecap="round" opacity="1.00"/><circle cx="345.0" cy="400.0" r="7.5" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.80" opacity="1.00"/><line x1="345.0" y1="400.0" x2="345.0" y2="525.0" stroke="#C0392B" stroke-width="1.30" stroke-linecap="round" opacity="1.00" stroke-dasharray="4,4"/><text x="359.0" y="386.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">N<tspan dy="4.0" font-size="9.7">s</tspan><tspan dy="-4.0" font-size="13.5">​</tspan> = 4 臨界點</text><text x="184.0" y="309.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#1E8449" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">有正向抵抗</text><text x="570.0" y="507.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="end" font-weight="700" font-style="normal" opacity="1.00">抵抗歸零，插深無效</text><text x="100.0" y="223.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14.0" fill="#1B2A41" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">p<tspan dy="4.2" font-size="10.1">net</tspan><tspan dy="-4.2" font-size="14.0">​</tspan> = 4c<tspan dy="4.2" font-size="10.1">u</tspan><tspan dy="-4.2" font-size="14.0">​</tspan> - γH　⇒　p<tspan dy="4.2" font-size="10.1">net</tspan><tspan dy="-4.2" font-size="14.0">​</tspan> / c<tspan dy="4.2" font-size="10.1">u</tspan><tspan dy="-4.2" font-size="14.0">​</tspan> = 4 - N<tspan dy="4.2" font-size="10.1">s</tspan><tspan dy="-4.2" font-size="14.0">​</tspan></text><rect x="60.0" y="548.0" width="530.0" height="71.5" rx="6.0" fill="#F7FAFD" stroke="#1B2A41" stroke-width="1.20" opacity="1.00"/><rect x="60.0" y="548.0" width="4.0" height="71.5" rx="2.0" fill="#1B2A41" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="74.0" y="568.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.0" fill="#1B2A41" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">順帶記住：臨界開挖深度</text><text x="74.0" y="588.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">H<tspan dy="3.8" font-size="9.0">c</tspan><tspan dy="-3.8" font-size="12.5">​</tspan> = N<tspan dy="3.8" font-size="9.0">c</tspan><tspan dy="-3.8" font-size="12.5">​</tspan> c<tspan dy="3.8" font-size="9.0">u</tspan><tspan dy="-3.8" font-size="12.5">​</tspan> / γ（N<tspan dy="3.8" font-size="9.0">c</tspan><tspan dy="-3.8" font-size="12.5">​</tspan> ≈ 5.14 ~ 5.7），換算過來就是 N<tspan dy="3.8" font-size="9.0">s</tspan><tspan dy="-3.8" font-size="12.5">​</tspan> 的上限；</text><text x="74.0" y="606.8" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">所以「Ns 大」＝「這個開挖深度對這種黏土來說太深了」。</text><text x="626.0" y="118.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="15.5" fill="#1B2A41" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">N<tspan dy="4.6" font-size="11.2">s</tspan><tspan dy="-4.6" font-size="15.5">​</tspan> 分區：一個數字同時決定三件事</text><rect x="626.0" y="140.0" width="320.0" height="112.0" rx="8.0" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.50" opacity="1.00"/><rect x="626.0" y="140.0" width="6.0" height="112.0" rx="3.0" fill="#1E8449" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="648.0" y="174.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="15.5" fill="#1E8449" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">N<tspan dy="4.6" font-size="11.2">s</tspan><tspan dy="-4.6" font-size="15.5">​</tspan> &lt; 3.14</text><text x="648.0" y="202.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">坑底穩定、淨抵抗充足；</text><text x="648.0" y="222.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">設計由擋土壁結構計算控制</text><rect x="626.0" y="268.0" width="320.0" height="112.0" rx="8.0" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.50" opacity="1.00"/><rect x="626.0" y="268.0" width="6.0" height="112.0" rx="3.0" fill="#2E6DA4" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="648.0" y="302.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="15.5" fill="#2E6DA4" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">3.14 ~ 4</text><text x="648.0" y="330.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">抵抗仍為正但已明顯變小；</text><text x="648.0" y="350.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">Peck 用硬黏土梯形 (0.2~0.4)γH</text><rect x="626.0" y="396.0" width="320.0" height="112.0" rx="8.0" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.50" opacity="1.00"/><rect x="626.0" y="396.0" width="6.0" height="112.0" rx="3.0" fill="#E8734A" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="648.0" y="430.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="15.5" fill="#E8734A" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">4 ~ 6</text><text x="648.0" y="458.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">p<tspan dy="3.8" font-size="9.0">net</tspan><tspan dy="-3.8" font-size="12.5">​</tspan> ≤ 0，插深失效；</text><text x="648.0" y="478.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">Peck 改用軟～中等黏土梯形</text><rect x="626.0" y="524.0" width="320.0" height="112.0" rx="8.0" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.50" opacity="1.00"/><rect x="626.0" y="524.0" width="6.0" height="112.0" rx="3.0" fill="#C0392B" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="648.0" y="558.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="15.5" fill="#C0392B" text-anchor="start" font-weight="700" font-style="normal" opacity="1.00">N<tspan dy="4.6" font-size="11.2">s</tspan><tspan dy="-4.6" font-size="15.5">​</tspan> &gt; 6</text><text x="648.0" y="586.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">基盤隆起與大變形高風險；</text><text x="648.0" y="606.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="400" font-style="normal" opacity="1.00">需地盤改良／分階開挖／降載</text></svg>