<text x="70.0" y="66.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" text-anchor="start" font-weight="bold">土層 1　K<tspan font-size="10.9" dy="4.5">a1</tspan><tspan dy="-4.5"> = 1/3</tspan></text>
<text x="70.0" y="420.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" text-anchor="start" font-weight="bold">土層 2　K<tspan font-size="10.9" dy="4.5">a2</tspan><tspan dy="-4.5"> = 0.26</tspan></text>
<rect x="240.0" y="103.0" width="120.0" height="120.0" rx="0" fill="#FFFFFF" stroke="#1F2A37" stroke-width="2"/>
<text x="269.7" y="170.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" text-anchor="start" font-weight="bold">z = 3 上</text>
<line x1="160.6" y1="163.0" x2="223.0" y2="163.0" stroke="#2F54C8" stroke-width="4" stroke-linecap="butt"/>
<polygon points="236.0,163.0 223.0,156.5 223.0,169.5" fill="#2F54C8" stroke="#2F54C8" stroke-width="1" stroke-linejoin="round"/>
<line x1="439.4" y1="163.0" x2="377.0" y2="163.0" stroke="#2F54C8" stroke-width="4" stroke-linecap="butt"/>
<polygon points="364.0,163.0 377.0,169.5 377.0,156.5" fill="#2F54C8" stroke="#2F54C8" stroke-width="1" stroke-linejoin="round"/>
<text x="447.4" y="170.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2F54C8" text-anchor="start" font-weight="bold">σ<tspan font-size="12.2" dy="5.0">h</tspan><tspan dy="-5.0"> = 23.67</tspan></text>
<rect x="240.0" y="247.0" width="120.0" height="120.0" rx="0" fill="#FFFFFF" stroke="#1F2A37" stroke-width="2"/>
<text x="269.7" y="314.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" text-anchor="start" font-weight="bold">z = 3 下</text>
<line x1="176.8" y1="307.0" x2="223.0" y2="307.0" stroke="#B8520E" stroke-width="4" stroke-linecap="butt"/>
<polygon points="236.0,307.0 223.0,300.5 223.0,313.5" fill="#B8520E" stroke="#B8520E" stroke-width="1" stroke-linejoin="round"/>
<line x1="423.2" y1="307.0" x2="377.0" y2="307.0" stroke="#B8520E" stroke-width="4" stroke-linecap="butt"/>
<polygon points="364.0,307.0 377.0,313.5 377.0,300.5" fill="#B8520E" stroke="#B8520E" stroke-width="1" stroke-linejoin="round"/>
<text x="431.2" y="314.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#B8520E" text-anchor="start" font-weight="bold">σ<tspan font-size="12.2" dy="5.0">h</tspan><tspan dy="-5.0"> = 18.46</tspan></text>
<rect x="560.0" y="40.0" width="560.0" height="390.0" rx="12" fill="#F4F6F9" stroke="#D5DAE1" stroke-width="1.2"/>
<text x="585.0" y="82.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" text-anchor="start" font-weight="bold">垂直：σ<tspan font-size="12.9" dy="5.3">v</tspan><tspan dy="-5.3"> = 20 + 17×3 = 71 kPa</tspan></text>
<text x="585.0" y="110.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="normal">界面上下同一個值 —— 上方土重沒有變</text>
<text x="585.0" y="160.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" text-anchor="start" font-weight="bold">水平：σ<tspan font-size="12.9" dy="5.3">h</tspan><tspan dy="-5.3"> = K × σ</tspan><tspan font-size="12.9" dy="5.3">v</tspan></text>
<text x="585.0" y="188.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#2F54C8" text-anchor="start" font-weight="bold">3 m 上側用 K<tspan font-size="10.9" dy="4.5">a1</tspan><tspan dy="-4.5">：71 × 1/3 = 23.67</tspan></text>
<text x="585.0" y="214.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#B8520E" text-anchor="start" font-weight="bold">3 m 下側用 K<tspan font-size="10.9" dy="4.5">a2</tspan><tspan dy="-4.5">：71 × 0.26 = 18.46</tspan></text>
<text x="585.0" y="240.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="normal">K 是「土的性質」，換土就換 K → σ<tspan font-size="10.2" dy="4.2">h</tspan><tspan dy="-4.2"> 必跳</tspan></text>
<line x1="585.0" y1="262.0" x2="1095.0" y2="262.0" stroke="#E3E7EC" stroke-width="1.5" stroke-linecap="butt"/>
<text x="585.0" y="298.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#C0392B" text-anchor="start" font-weight="bold">若界面只算一次（23.67 直接往下接）：</text>
<text x="585.0" y="326.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" text-anchor="start" font-weight="normal">下層矩形 23.67 × 4 = 94.7（正確 73.8）</text>
<text x="585.0" y="354.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" text-anchor="start" font-weight="normal">P 變成 179.7 kN/m，多算 13%</text>
<text x="585.0" y="400.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2E7D6B" text-anchor="start" font-weight="bold">分層 = 兩條 σ<tspan font-size="12.2" dy="5.0">a</tspan><tspan dy="-5.0"> 線，各用各的 K</tspan></text>
</svg>
