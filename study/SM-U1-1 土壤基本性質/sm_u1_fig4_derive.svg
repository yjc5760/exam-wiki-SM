<svg xmlns="http://www.w3.org/2000/svg" width="900" height="514" viewBox="0 0 900 514" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="900" height="392"/></clipPath></defs><rect width="900" height="514" fill="#FFFFFF"/><text x="450.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 4　第三階段：Se = wGs 是怎麼「讀」出來的</text><text x="450.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">它不需要死背——只是含水量定義在 Vs = 1 座標系下的直接呈現</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><text x="450.00" y="40.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">把三相圖上的重量，代進含水量的定義式</text><text x="396.87" y="78.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="24" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">w = W<tspan dy="7.20" font-size="16.32">w</tspan><tspan dy="-7.20" font-size="24"> / W</tspan><tspan dy="7.20" font-size="16.32">s</tspan></text><text x="374.00" y="152.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="23" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">w =</text><text x="470.00" y="134.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="23" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">Se</text><text x="470.00" y="134.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="23" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">γ<tspan dy="6.90" font-size="15.64">w</tspan></text><line x1="472" y1="145" x2="500" y2="123" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round"/><text x="470.00" y="188.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="23" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">Gs</text><text x="470.00" y="188.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="23" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">γ<tspan dy="6.90" font-size="15.64">w</tspan></text><line x1="472" y1="199" x2="500" y2="177" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round"/><line x1="394" y1="161" x2="516" y2="161" stroke="#1F2733" stroke-width="2.2" stroke-linecap="round"/><text x="450.00" y="218.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">γw 在分子分母各出現一次，必然相消</text><text x="394.88" y="252.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="24" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">w = Se / G<tspan dy="7.20" font-size="16.32">s</tspan></text><text x="450.00" y="282.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩邊同乘 Gs</text><rect x="300" y="302" width="300" height="58" rx="14" fill="#F5F7FA" stroke="#B45309" stroke-width="2.0"/><text x="400.81" y="332.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="28" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">Se = wG<tspan dy="8.40" font-size="19.04">s</tspan></text><text x="26.00" y="322.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">所以恆等式裡</text><text x="26.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">看不到 γw</text><text x="874.00" y="322.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">它不是新公式，</text><text x="874.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">是定義式的必然結果</text></g><text x="450.0" y="492" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">推導只有一行，考場上忘記時 20 秒可以重推一次。</text></svg>