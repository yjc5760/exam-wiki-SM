<svg xmlns="http://www.w3.org/2000/svg" width="900" height="518" viewBox="0 0 900 518" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="900" height="396"/></clipPath></defs><rect width="900" height="518" fill="#FFFFFF"/><text x="450.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 5　唯一的跨界橋樑：Se = wGs</text><text x="450.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">為什麼這條式子出題率最高？因為它是重量世界與體積世界之間唯一的通道</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="26" y="40" width="300" height="196" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.3"/><text x="176.00" y="68.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">重量世界</text><text x="176.00" y="92.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">實驗室秤得出來</text><text x="133.94" y="130.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="19" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">w = W<tspan dy="5.70" font-size="12.92">w</tspan><tspan dy="-5.70" font-size="19"> / W</tspan><tspan dy="5.70" font-size="12.92">s</tspan></text><text x="176.00" y="162.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">烘乾前後各秤一次即得</text><text x="176.00" y="202.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">w = 15%</text><rect x="574" y="40" width="300" height="196" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.3"/><text x="724.00" y="68.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">體積世界</text><text x="724.00" y="92.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">土體中極難直接量測</text><text x="684.16" y="128.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">e = V<tspan dy="5.40" font-size="12.24">v</tspan><tspan dy="-5.40" font-size="18"> / V</tspan><tspan dy="5.40" font-size="12.24">s</tspan></text><text x="684.16" y="160.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">S = V<tspan dy="5.40" font-size="12.24">w</tspan><tspan dy="-5.40" font-size="18"> / V</tspan><tspan dy="5.40" font-size="12.24">v</tspan></text><text x="724.00" y="202.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">e = 0.65 → S = 62.3%</text><polyline points="340,116 390,94 450,87 510,94 560,116" fill="none" stroke="#B45309" stroke-width="4.5" stroke-linecap="round"/><line x1="368" y1="105.1" x2="368" y2="138" stroke="#B45309" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="450" y1="89.0" x2="450" y2="138" stroke="#B45309" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="532" y1="105.1" x2="532" y2="138" stroke="#B45309" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="334.00" y1="138.00" x2="556.00" y2="138.00" stroke="#B45309" stroke-width="2.6" stroke-linecap="round"/><polygon points="566.00,138.00 556.00,142.60 556.00,133.40" fill="#B45309"/><line x1="566.00" y1="138.00" x2="344.00" y2="138.00" stroke="#B45309" stroke-width="2.6" stroke-linecap="round"/><polygon points="334.00,138.00 344.00,133.40 344.00,142.60" fill="#B45309"/><text x="416.62" y="64.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="19" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">G<tspan dy="5.70" font-size="12.92">s</tspan><tspan dy="-5.70" font-size="19"> = 2.7</tspan></text><text x="450.00" y="192.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">比重＝兩個世界的換匯率</text><rect x="26" y="262" width="848" height="104" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.3"/><text x="364.90" y="300.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="30" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">S · e = w · G<tspan dy="9.00" font-size="20.4">s</tspan></text><text x="450.00" y="342.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">四個參數給三個，第四個必定案；不給 Gs 就是要你用兩狀態聯立解它</text></g><text x="450.0" y="496" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">驗算：wGs = 0.405 = Se = 0.405，兩邊都是「每單位土粒的水體積」。</text></svg>