<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1000" height="300"/></clipPath></defs><rect width="1000" height="376" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 11　整份單元的推導因果鏈</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">物理定義 → 固體錨點 → 填滿三相圖 → 讀出萬用恆等式與單位重母式</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="22" y="62" width="212" height="150" rx="14" fill="#F5F7FA" stroke="#6B7684" stroke-width="2.0"/><text x="128.00" y="90.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 物理定義</text><text x="101.90" y="122.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">e = V<tspan dy="4.05" font-size="9.18">v</tspan><tspan dy="-4.05" font-size="13.5">/V</tspan><tspan dy="4.05" font-size="9.18">s</tspan></text><text x="101.90" y="150.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">S = V<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/V</tspan><tspan dy="4.05" font-size="9.18">v</tspan></text><text x="101.90" y="178.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">w = W<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/W</tspan><tspan dy="4.05" font-size="9.18">s</tspan></text><line x1="239.00" y1="137.00" x2="251.00" y2="137.00" stroke="#6B7684" stroke-width="3.0" stroke-linecap="round"/><polygon points="261.00,137.00 251.00,141.60 251.00,132.40" fill="#6B7684"/><rect x="266" y="62" width="212" height="150" rx="14" fill="#F5F7FA" stroke="#B45309" stroke-width="2.0"/><text x="372.00" y="90.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 立固體錨點</text><text x="346.66" y="122.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">令 V<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5"> = 1</tspan></text><text x="372.00" y="150.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">土粒守恆</text><text x="372.00" y="178.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">孔隙可變</text><line x1="483.00" y1="137.00" x2="495.00" y2="137.00" stroke="#B45309" stroke-width="3.0" stroke-linecap="round"/><polygon points="505.00,137.00 495.00,141.60 495.00,132.40" fill="#B45309"/><rect x="510" y="62" width="212" height="150" rx="14" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="2.0"/><text x="616.00" y="90.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">③ 填滿六格</text><text x="581.26" y="122.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">V<tspan dy="4.05" font-size="9.18">v</tspan><tspan dy="-4.05" font-size="13.5">=e, V</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">=Se</tspan></text><text x="594.80" y="150.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">W<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5">=G</tspan><tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5">γ</tspan><tspan dy="4.05" font-size="9.18">w</tspan></text><text x="593.68" y="178.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">W<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">=Seγ</tspan><tspan dy="4.05" font-size="9.18">w</tspan></text><line x1="727.00" y1="137.00" x2="739.00" y2="137.00" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round"/><polygon points="749.00,137.00 739.00,141.60 739.00,132.40" fill="#1D4ED8"/><rect x="754" y="62" width="212" height="150" rx="14" fill="#F5F7FA" stroke="#2E7D6F" stroke-width="2.0"/><text x="860.00" y="90.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">④ 讀出公式</text><text x="836.28" y="122.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">Se = wG<tspan dy="4.05" font-size="9.18">s</tspan></text><text x="800.69" y="150.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">γ =(G<tspan dy="4.05" font-size="9.18">s</tspan><tspan dy="-4.05" font-size="13.5">+Se)γ</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/(1+e)</tspan></text><text x="860.00" y="178.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">n = e/(1+e)</text><text x="500.00" y="40.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">一條因果鏈，四個步驟；中間沒有任何一步需要記憶</text><text x="500.00" y="246.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">考場上忘記任何一條換算式，就從 ① 重走一次——比回想公式更快也更不會錯</text></g></svg>