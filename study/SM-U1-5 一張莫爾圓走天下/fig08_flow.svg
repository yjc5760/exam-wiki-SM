<rect x="640.0" y="146.0" width="330.0" height="84.0" rx="10" fill="#EEF2FB" stroke="#4A6380" stroke-width="2"/>
<text x="749.0" y="178.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#4A6380" font-weight="bold">② 幾何式移項</text>
<text x="715.0" y="208.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">c′ = (R − C sin φ′) / cos φ′</text>
