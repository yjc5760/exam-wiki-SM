<text x="1046.8" y="332.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C9D3DF" font-weight="normal">差 &lt; 0.1 kPa</text>
<text x="1066.5" y="366.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C9D3DF" font-weight="normal">才交卷</text>
