<text x="432.0" y="390.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#C0392B" font-weight="bold">否</text>
<rect x="270.0" y="400.0" width="300.0" height="62.0" rx="10" fill="#FBF3E4" stroke="#B7791F" stroke-width="2"/>
<text x="346.0" y="432.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#B7791F" font-weight="bold">兩組試驗：① 相減</text>
<text x="420.0" y="462.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal"></text>
<text x="324.2" y="452.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">K<tspan font-size="10.2" dy="4.2">p</tspan><tspan dy="-4.2"> = Δσ′</tspan><tspan font-size="10.2" dy="4.2">1</tspan><tspan dy="-4.2"> / Δσ′</tspan><tspan font-size="10.2" dy="4.2">3</tspan><tspan dy="-4.2">，再回代求 c′</tspan></text>
<rect x="1000.0" y="60.0" width="185.0" height="360.0" rx="12" fill="#1B2432" stroke="#1B2432" stroke-width="1.2"/>
<text x="1056.0" y="106.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#F2A65A" font-weight="bold">最後一律</text>
<text x="1043.0" y="146.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#FFFFFF" font-weight="bold">用 ② 驗算</text>
<text x="1062.4" y="196.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C9D3DF" font-weight="normal">C sin φ′</text>
<text x="1052.8" y="230.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C9D3DF" font-weight="normal">+ c′ cos φ′</text>
<text x="1052.6" y="264.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C9D3DF" font-weight="normal">是否 = R？</text>
