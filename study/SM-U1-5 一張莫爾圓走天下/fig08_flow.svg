<polygon points="420.0,142.0 540.0,188.0 420.0,234.0 300.0,188.0" fill="#FFFFFF" stroke="#1B2432" stroke-width="2.2" stroke-linejoin="round"/>
<text x="356.7" y="194.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1B2432" font-weight="bold">已知 φ′，求 c′？</text>
