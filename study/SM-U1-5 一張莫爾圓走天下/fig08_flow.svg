<text x="582.0" y="308.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#2E7D6B" font-weight="bold">是</text>
<rect x="640.0" y="276.0" width="330.0" height="84.0" rx="10" fill="#FDEDE8" stroke="#E4572E" stroke-width="2"/>
<text x="767.0" y="308.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#E4572E" font-weight="bold">① 萬能式</text>
<text x="716.6" y="338.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">令 y = √K<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> 解一元二次式</tspan></text>
