<text x="878.0" y="190.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#E4572E" font-weight="bold">例：200/400 = 0.50 → φ′ = 30°</text>
