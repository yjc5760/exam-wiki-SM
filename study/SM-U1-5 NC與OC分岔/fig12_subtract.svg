<text x="436.0" y="58.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">過原點外推 400（錯）</text>
<line x1="84.0" y1="401.4" x2="90.0" y2="401.4" stroke="#1F2A37" stroke-width="1.4" stroke-linecap="butt"/>
<text x="63.5" y="406.4" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#B7791F" font-weight="bold">10</text>
<text x="332.2" y="384.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#B7791F" font-weight="bold">截距 2c′√K<tspan font-size="10.2" dy="4.2">p</tspan><tspan dy="-4.2"> = 10</tspan></text>
<line x1="324.6" y1="378.0" x2="105.6" y2="402.5" stroke="#B7791F" stroke-width="1.6" stroke-linecap="butt"/>
<polygon points="97.7,403.4 106.0,406.5 105.2,398.5" fill="#B7791F" stroke="#B7791F" stroke-width="1" stroke-linejoin="round"/>
<rect x="770.0" y="20.0" width="415.0" height="215.0" rx="12" fill="#FBF3E4" stroke="#B7791F" stroke-width="1.6"/>
<text x="790.0" y="56.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#B7791F" font-weight="bold">相減 = 算直線斜率</text>
<text x="790.0" y="92.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">兩點代入同一條直線，相減後截距消失</text>
<text x="790.0" y="128.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">K<tspan font-size="12.9" dy="5.3">p</tspan><tspan dy="-5.3"> = 70 / 40 = 1.75</tspan></text>
<text x="790.0" y="164.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">回代：2c′√K<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> = 80 − 40 × 1.75 = 10</tspan></text>
<text x="790.0" y="200.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" font-weight="normal">兩項都保留，不必先解 c′、φ′</text>
<rect x="770.0" y="250.0" width="415.0" height="195.0" rx="12" fill="#E6F2EF" stroke="#2E7D6B" stroke-width="1.6"/>
<text x="790.0" y="286.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2E7D6B" font-weight="bold">CD 試體三（σ′<tspan font-size="12.2" dy="5.0">3</tspan><tspan dy="-5.0"> = 200）</tspan></text>
<text x="790.0" y="322.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1F2A37" font-weight="bold">σ′<tspan font-size="11.6" dy="4.8">1</tspan><tspan dy="-4.8"> = 200 × 1.75 + 10 = 360</tspan></text>
<text x="790.0" y="358.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#2E7D6B" font-weight="bold">Δσ = 360 − 200 = 160 kN/m²</text>
<text x="790.0" y="394.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" font-weight="normal">若把試體一「過原點」外推：</text>
<text x="790.0" y="424.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">σ′<tspan font-size="10.2" dy="4.2">1</tspan><tspan dy="-4.2"> = 400 → Δσ = 200（高估 25%）</tspan></text>
</svg>
