<text x="210.7" y="363.2" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#4A6380" font-weight="bold">Δσ′<tspan font-size="10.2" dy="4.2">3</tspan><tspan dy="-4.2"> = 40</tspan></text>
<text x="304.0" y="316.1" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#4A6380" font-weight="bold">Δσ′<tspan font-size="10.2" dy="4.2">1</tspan><tspan dy="-4.2"> = 70</tspan></text>
