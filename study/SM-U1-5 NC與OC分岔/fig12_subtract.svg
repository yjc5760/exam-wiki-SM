<text x="169.7" y="269.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#B7791F" font-weight="bold">試體二 (80, 150)</text>
<text x="614.0" y="124.4" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#2E7D6B" font-weight="bold">試體三 CD (200, 360)</text>
