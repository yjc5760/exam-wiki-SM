<text x="790.0" y="94.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1F2A37" font-weight="bold">K<tspan font-size="11.6" dy="4.8">p</tspan><tspan dy="-4.8"> = tan²(45° + φ′/2)</tspan></text>
<text x="790.0" y="128.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1F2A37" font-weight="bold">    = (1 + sin φ′) / (1 − sin φ′)</text>
<text x="790.0" y="164.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">√K<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> = tan θ（θ = 破壞面角）</tspan></text>
<text x="790.0" y="198.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#E4572E" font-weight="bold">sin φ′ = (K<tspan font-size="11.6" dy="4.8">p</tspan><tspan dy="-4.8"> − 1) / (K</tspan><tspan font-size="11.6" dy="4.8">p</tspan><tspan dy="-4.8"> + 1)</tspan></text>
