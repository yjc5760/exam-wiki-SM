<text x="790.0" y="306.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">有 K<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> 就有 φ′，兩者互推免查表</tspan></text>
<text x="790.0" y="340.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">NC、OC 都成立（只是三角恆等式）</text>
<text x="790.0" y="374.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">中間計算一律保留 K<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5">、√K</tspan><tspan font-size="10.9" dy="4.5">p</tspan></text>
<text x="790.0" y="408.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">最後要報告時才換成角度</text>
