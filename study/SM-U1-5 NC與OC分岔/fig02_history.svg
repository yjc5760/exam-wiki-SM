<text x="800.0" y="228.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">現在的 σ′<tspan font-size="10.9" dy="4.5">0</tspan><tspan dy="-4.5"> 就是歷史最大</tspan></text>
<text x="800.0" y="260.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">沒有「更大應力」的擠壓記憶 → c′ = 0</text>
<rect x="780.0" y="303.0" width="405.0" height="142.0" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-width="1.6"/>
<text x="800.0" y="339.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#C0392B" font-weight="bold">OC（OCR &gt; 1）</text>
<text x="800.0" y="373.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">成因：地層侵蝕、冰河退去、開挖解壓</text>
<text x="800.0" y="405.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">顆粒保持較緊密排列 → 重新剪切時</text>
<text x="800.0" y="433.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">多出一段截距 c′ ≠ 0</text>
