<text x="800.0" y="90.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#1F2A37" font-weight="bold">OCR = σ′<tspan font-size="15.0" dy="6.2">p</tspan><tspan dy="-6.2"> / σ′</tspan><tspan font-size="15.0" dy="6.2">0</tspan></text>
<text x="800.0" y="124.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6B7280" font-weight="normal">本圖 OC 土：200 / 50 = 4</text>
<rect x="780.0" y="158.0" width="405.0" height="130.0" rx="12" fill="#E6F2EF" stroke="#2E7D6B" stroke-width="1.6"/>
