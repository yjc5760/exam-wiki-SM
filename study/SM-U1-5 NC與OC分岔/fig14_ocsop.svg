<text x="765.6" y="78.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">K<tspan font-size="10.2" dy="4.2">p</tspan><tspan dy="-4.2"> = (σ′</tspan><tspan font-size="10.2" dy="4.2">1a</tspan><tspan dy="-4.2"> − σ′</tspan><tspan font-size="10.2" dy="4.2">1b</tspan><tspan dy="-4.2">) / (σ′</tspan><tspan font-size="10.2" dy="4.2">3a</tspan><tspan dy="-4.2"> − σ′</tspan><tspan font-size="10.2" dy="4.2">3b</tspan><tspan dy="-4.2">)，回代得 2c′√K</tspan><tspan font-size="10.2" dy="4.2">p</tspan></text>
<text x="775.1" y="102.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#6B7280" font-weight="normal">[SM-2025-2]：K<tspan font-size="9.5" dy="3.9">p</tspan><tspan dy="-3.9"> = 70/40 = 1.75、2c′√K</tspan><tspan font-size="9.5" dy="3.9">p</tspan><tspan dy="-3.9"> = 10</tspan></text>
