<text x="342.4" y="242.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#6B7280" font-weight="normal">[SM-2024-1]：10y² + 5y − 34 = 0 → y = 1.6108</text>
