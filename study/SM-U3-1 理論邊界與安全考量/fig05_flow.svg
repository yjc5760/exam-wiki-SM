<text x="525.5" y="253.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#6B7280" font-weight="bold">否</text>
<line x1="825.0" y1="265.0" x2="871.0" y2="265.0" stroke="#9AA3AE" stroke-width="2.5" stroke-linecap="butt"/>
<polygon points="883.0,265.0 871.0,259.0 871.0,271.0" fill="#9AA3AE" stroke="#9AA3AE" stroke-width="1" stroke-linejoin="round"/>
