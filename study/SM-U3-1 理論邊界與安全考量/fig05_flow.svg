<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="10.0" y="215.0" width="175.0" height="100.0" rx="12" fill="#F4F6F9" stroke="#D5DAE1" stroke-width="1.5"/>
<text x="49.5" y="257.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">讀題：牆背</text>
<text x="49.5" y="287.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">與填土幾何</text>
<polygon points="370.0,185.0 495.0,265.0 370.0,345.0 245.0,265.0" fill="#FFFFFF" stroke="#B8520E" stroke-width="2.2" stroke-linejoin="round"/>
