<rect x="885.0" y="190.0" width="305.0" height="150.0" rx="12" fill="#EEF2FB" stroke="#2F54C8" stroke-width="2.4"/>
<text x="961.2" y="230.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21.0" fill="#2F54C8" font-weight="bold">Rankine 基本式</text>
<text x="966.8" y="264.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">K<tspan font-size="10.9" dy="4.5">a</tspan><tspan dy="-4.5"> = tan²(45° − φ/2)</tspan></text>
<text x="958.3" y="290.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">合力水平、作用於 H/3</text>
<line x1="370.0" y1="185.0" x2="370.0" y2="144.0" stroke="#9AA3AE" stroke-width="2.5" stroke-linecap="butt"/>
<polygon points="370.0,132.0 364.0,144.0 376.0,144.0" fill="#9AA3AE" stroke="#9AA3AE" stroke-width="1" stroke-linejoin="round"/>
<text x="384.0" y="161.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#B8520E" font-weight="bold">是</text>
<rect x="205.0" y="10.0" width="330.0" height="120.0" rx="12" fill="#FBF1EA" stroke="#B8520E" stroke-width="2.4"/>
<text x="299.7" y="50.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21.0" fill="#B8520E" font-weight="bold">Coulomb 公式</text>
<text x="313.2" y="84.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">K<tspan font-size="10.9" dy="4.5">a</tspan><tspan dy="-4.5"> = f(φ, δ, θ, β)</tspan></text>
<text x="307.5" y="110.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">合力偏牆背法線 δ</text>
<line x1="700.0" y1="345.0" x2="700.0" y2="386.0" stroke="#9AA3AE" stroke-width="2.5" stroke-linecap="butt"/>
<polygon points="700.0,398.0 706.0,386.0 694.0,386.0" fill="#9AA3AE" stroke="#9AA3AE" stroke-width="1" stroke-linejoin="round"/>
<text x="714.0" y="375.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#B8520E" font-weight="bold">是（牆背仍垂直光滑）</text>
<rect x="535.0" y="400.0" width="330.0" height="130.0" rx="12" fill="#EEF2FB" stroke="#2F54C8" stroke-width="2.4"/>
<text x="623.7" y="440.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21.0" fill="#2F54C8" font-weight="bold">Rankine 斜填土</text>
<text x="644.8" y="474.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">K<tspan font-size="10.9" dy="4.5">a</tspan><tspan dy="-4.5"> 含 cosβ 修正</tspan></text>
<text x="621.2" y="500.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">合力平行坡面（偏 β）</text>
<rect x="885.0" y="400.0" width="305.0" height="130.0" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="970.5" y="438.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#C0392B" font-weight="bold">被動側另外把關</text>
<text x="950.2" y="472.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">δ 大時 Coulomb K<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> 過高</tspan></text>
<text x="955.1" y="500.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">→ Rankine 或對數螺線</text>
<rect x="560.0" y="20.0" width="630.0" height="110.0" rx="12" fill="#F4F6F9" stroke="#D5DAE1" stroke-width="1.2"/>
<text x="585.0" y="58.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#B8520E" font-weight="bold">關鍵字＝切換訊號</text>
<text x="585.0" y="92.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">「牆背摩擦角」「牆背傾斜」「牆背粗糙」→ Coulomb</text>
<text x="585.0" y="118.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">只有「地表坡角」→ Rankine 斜填土即可</text>
<text x="20.0" y="420.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#6B7280" font-weight="bold">沒說 δ</text>
<text x="20.0" y="448.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#6B7280" font-weight="bold">＝預設光滑垂直</text>
<text x="20.0" y="476.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#2F54C8" font-weight="bold">＝ Rankine</text>
