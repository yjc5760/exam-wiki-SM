<text x="384.5" y="345.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">示範黏土 A：σ<tspan font-size="12.9" dy="5.3">3</tspan><tspan dy="-5.3"> = 100、Δσ</tspan><tspan font-size="12.9" dy="5.3">d</tspan><tspan dy="-5.3"> = 80、u</tspan><tspan font-size="12.9" dy="5.3">f</tspan><tspan dy="-5.3"> = 60（kPa）</tspan></text>
<text x="363.9" y="380.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6B7280" font-weight="normal">c′ ≠ 0 時第 3 步改用 σ′<tspan font-size="10.9" dy="4.5">1</tspan><tspan dy="-4.5"> = σ′</tspan><tspan font-size="10.9" dy="4.5">3</tspan><tspan dy="-4.5"> K</tspan><tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> + 2c′√K</tspan><tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5">（兩組試驗相減消去 c′）</tspan></text>
