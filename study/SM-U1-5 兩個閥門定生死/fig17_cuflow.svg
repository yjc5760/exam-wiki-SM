<text x="990.9" y="170.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="bold">A<tspan font-size="12.2" dy="5.0">f</tspan><tspan dy="-5.0"> = u</tspan><tspan font-size="12.2" dy="5.0">f</tspan><tspan dy="-5.0"> / Δσ</tspan><tspan font-size="12.2" dy="5.0">d</tspan></text>
