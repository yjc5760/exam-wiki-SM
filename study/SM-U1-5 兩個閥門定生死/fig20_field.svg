<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="20.0" y="190.0" width="180.0" height="80.0" rx="10" fill="#E8ECF2" stroke="#1B2432" stroke-width="2.2"/>
<text x="47.0" y="224.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1B2432" font-weight="bold">分析哪個時點？</text>
<text x="50.0" y="252.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">問：水來得及排嗎</text>
<line x1="200.0" y1="230.0" x2="239.0" y2="230.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="250.0,230.0 239.0,224.5 239.0,235.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<polygon points="360.0,170.0 470.0,230.0 360.0,290.0 250.0,230.0" fill="#FFFFFF" stroke="#1B2432" stroke-width="2.2" stroke-linejoin="round"/>
<text x="271.1" y="236.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1B2432" font-weight="bold">載重施加速度 ≫ 排水？</text>
<line x1="360.0" y1="170.0" x2="360.0" y2="110.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<text x="370.0" y="146.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">是（黏土、快）</text>
<line x1="470.0" y1="230.0" x2="549.0" y2="230.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="560.0,230.0 549.0,224.5 549.0,235.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<text x="480.0" y="220.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#2E7D6B" font-weight="bold">否（砂、慢、長期）</text>
<polygon points="640.0,20.0 760.0,70.0 640.0,120.0 520.0,70.0" fill="#FFFFFF" stroke="#1B2432" stroke-width="2.2" stroke-linejoin="round"/>
<text x="555.0" y="76.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1B2432" font-weight="bold">先在前期載重下壓密？</text>
<line x1="360.0" y1="110.0" x2="360.0" y2="70.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="360.0" y1="70.0" x2="507.0" y2="70.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="518.0,70.0 507.0,64.5 507.0,75.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<line x1="760.0" y1="70.0" x2="809.0" y2="70.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="820.0,70.0 809.0,64.5 809.0,75.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<text x="752.0" y="58.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#C0392B" font-weight="bold">否</text>
<rect x="825.0" y="25.0" width="350.0" height="95.0" rx="10" fill="#FBECEA" stroke="#C0392B" stroke-width="2.2"/>
<text x="915.5" y="66.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#C0392B" font-weight="bold">UU → S<tspan font-size="12.9" dy="5.3">u</tspan><tspan dy="-5.3">（φ</tspan><tspan font-size="12.9" dy="5.3">u</tspan><tspan dy="-5.3"> = 0）</tspan></text>
<text x="895.0" y="94.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">施工期／開挖後立即／快速填土</text>
<line x1="640.0" y1="120.0" x2="640.0" y2="164.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="640.0,175.0 645.5,164.0 634.5,164.0" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<text x="650.0" y="155.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#E07B39" font-weight="bold">是</text>
<rect x="825.0" y="150.0" width="350.0" height="95.0" rx="10" fill="#FDF1E7" stroke="#E07B39" stroke-width="2.2"/>
<text x="915.4" y="191.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#E07B39" font-weight="bold">CU → φ<tspan font-size="12.9" dy="5.3">cu</tspan><tspan dy="-5.3"> ＋ c′、φ′</tspan></text>
<text x="910.0" y="219.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">既有堤上再加高／水位驟降</text>
<line x1="640.0" y1="175.0" x2="640.0" y2="197.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="640.0" y1="197.0" x2="809.0" y2="197.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="820.0,197.0 809.0,191.5 809.0,202.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<rect x="565.0" y="300.0" width="610.0" height="95.0" rx="10" fill="#E6F2EF" stroke="#2E7D6B" stroke-width="2.2"/>
<text x="753.2" y="341.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#2E7D6B" font-weight="bold">CD（或 CU 量 u）→ c′、φ′</text>
<text x="712.5" y="369.5" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">長期穩定／砂土／緩慢加載：一律有效應力分析</text>
<line x1="560.0" y1="230.0" x2="560.0" y2="347.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="560.0" y1="347.0" x2="554.0" y2="347.0" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="565.0,347.0 554.0,341.5 554.0,352.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<text x="277.2" y="440.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="bold">黏土短期多半最危險（UU），長期（CD）再檢核；一個工程常同時需要兩組參數</text>
</svg>
