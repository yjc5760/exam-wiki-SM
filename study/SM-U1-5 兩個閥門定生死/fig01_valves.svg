<rect x="308.0" y="103.0" width="404.0" height="159.0" rx="12" fill="#E6F2EF" stroke="#2E7D6B" stroke-width="2.4"/>
<text x="336.0" y="173.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="50.0" fill="#2E7D6B" font-weight="bold">CD</text>
<text x="338.0" y="213.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2E7D6B" font-weight="bold">壓密排水</text>
<text x="483.0" y="165.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="normal">u 全程 = 0</text>
<text x="483.0" y="203.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2E7D6B" font-weight="bold">直接量到 c′、φ′</text>
<rect x="728.0" y="103.0" width="404.0" height="159.0" rx="12" fill="#FDF1E7" stroke="#E07B39" stroke-width="2.4"/>
<text x="756.0" y="173.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="50.0" fill="#E07B39" font-weight="bold">CU</text>
<text x="758.0" y="213.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#E07B39" font-weight="bold">壓密不排水</text>
<text x="903.0" y="165.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="normal">剪切時累積 u<tspan font-size="12.2" dy="5.0">f</tspan></text>
<text x="903.0" y="203.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#E07B39" font-weight="bold">φ<tspan font-size="12.2" dy="5.0">cu</tspan><tspan dy="-5.0">（總）＋ φ′（有效）</tspan></text>
<rect x="308.0" y="278.0" width="404.0" height="159.0" rx="12" fill="#F4F5F7" stroke="#9AA3AE" stroke-width="2.4"/>
<text x="336.0" y="348.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="50.0" fill="#9AA3AE" font-weight="bold">UD</text>
<text x="338.0" y="388.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#9AA3AE" font-weight="bold">不壓密排水</text>
<text x="483.0" y="340.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="normal">現場沒有這種情境</text>
<text x="483.0" y="378.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#6B7280" font-weight="bold">不做這個試驗</text>
<line x1="326.0" y1="358.0" x2="448.0" y2="314.0" stroke="#9AA3AE" stroke-width="4" stroke-linecap="butt"/>
<rect x="728.0" y="278.0" width="404.0" height="159.0" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-width="2.4"/>
<text x="756.0" y="348.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="50.0" fill="#C0392B" font-weight="bold">UU</text>
<text x="758.0" y="388.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#C0392B" font-weight="bold">不壓密不排水</text>
<text x="903.0" y="340.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="normal">Δu = Δσ<tspan font-size="12.2" dy="5.0">3</tspan><tspan dy="-5.0">，σ′ 鎖死</tspan></text>
<text x="903.0" y="378.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#C0392B" font-weight="bold">φ<tspan font-size="12.2" dy="5.0">u</tspan><tspan dy="-5.0"> = 0、S</tspan><tspan font-size="12.2" dy="5.0">u</tspan><tspan dy="-5.0"> = R</tspan></text>
<text x="416.0" y="468.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">閥門的開關組合 → 決定孔隙水壓 u 怎麼變 → 決定你量到的是哪一組參數</text>
