<text x="416.0" y="76.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#2E7D6B" font-weight="bold">開（慢慢剪，水隨時排走）</text>
<circle cx="798.0" cy="70" r="16" fill="#FBECEA" stroke="#C0392B" stroke-width="3"/>
