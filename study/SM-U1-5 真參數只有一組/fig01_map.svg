<text x="50.0" y="220.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">u<tspan font-size="10.9" dy="4.5">f</tspan><tspan dy="-4.5"> = +60 kPa</tspan></text>
<text x="231.6" y="208.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#2F54C8" font-weight="bold">φ<tspan font-size="15.0" dy="6.2">cu</tspan><tspan dy="-6.2"> = 16.6°</tspan></text>
