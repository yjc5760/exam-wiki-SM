<text x="597.3" y="245.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#F2A65A" font-weight="bold">σ′ = σ − u</text>
<text x="611.0" y="285.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C9D3DF" font-weight="normal">只看骨架</text>
<line x1="727.0" y1="235.0" x2="782.0" y2="235.0" stroke="#E4572E" stroke-width="4" stroke-linecap="butt"/>
