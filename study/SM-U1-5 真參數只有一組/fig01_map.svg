<text x="50.0" y="320.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">u<tspan font-size="10.9" dy="4.5">f</tspan><tspan dy="-4.5"> = −20 kPa</tspan></text>
<text x="231.6" y="308.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#6D4BC2" font-weight="bold">φ<tspan font-size="15.0" dy="6.2">cu</tspan><tspan dy="-6.2"> = 41.8°</tspan></text>
<line x1="362.0" y1="299.0" x2="548.6" y2="238.7" stroke="#6D4BC2" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="560.0,235.0 546.7,233.0 550.4,244.4" fill="#6D4BC2" stroke="#6D4BC2" stroke-width="1" stroke-linejoin="round"/>
