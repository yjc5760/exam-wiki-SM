<text x="50.0" y="120.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">u = 0（閥門開）</text>
<text x="259.5" y="108.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#2E7D6B" font-weight="bold">φ<tspan font-size="15.0" dy="6.2">d</tspan><tspan dy="-6.2"> = 30°</tspan></text>
