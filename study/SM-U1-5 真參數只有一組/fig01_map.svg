<text x="863.6" y="215.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="34.0" fill="#1F2A37" font-weight="bold">c′ = 0　φ′ = 30°</text>
<text x="905.3" y="262.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#1F2A37" font-weight="normal">τ<tspan font-size="15.0" dy="6.2">f</tspan><tspan dy="-6.2"> = c′ + σ′ tan φ′</tspan></text>
<text x="891.0" y="305.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6B7280" font-weight="normal">四種試驗的有效應力莫爾圓</text>
<text x="915.0" y="330.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6B7280" font-weight="normal">全部切在同一條線上</text>
<text x="777.2" y="420.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">左邊四個角度 = 試驗的產物　右邊一組 = 土的性質</text>
</svg>
