<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar1B2A419" markerWidth="6.3" markerHeight="6.3" refX="6.3" refY="3.1" orient="auto"><path d="M0,0 L6.3,3.1 L0,6.3 z" fill="#1B2A41"/></marker></defs><rect x="0" y="0" width="980" height="690" fill="#FFFFFF"/><line x1="40.0" y1="54.0" x2="940.0" y2="54.0" stroke="#4C6B8A" stroke-width="1.20" stroke-linecap="round" opacity="0.45"/><text x="40.0" y="42.0" font-family="Noto Serif CJK TC" font-size="25.0" fill="#1B2A41" text-anchor="start" font-weight="bold" opacity="1.00">莫爾圓怎麼「撞」出 K<tspan font-size="17.5" dy="7.5">a</tspan><tspan dy="-7.5">​</tspan> 與 K<tspan font-size="17.5" dy="7.5">p</tspan><tspan dy="-7.5">​</tspan></text><text x="940.0" y="42.0" font-family="Noto Sans CJK TC" font-size="14.0" fill="#5C7A99" text-anchor="end" font-weight="normal" opacity="1.00">同一個 σ&#x27;<tspan font-size="9.8" dy="4.2">v</tspan><tspan dy="-4.2">​</tspan>，往兩邊長大，撞到同一條破壞包絡線</text><rect x="60.0" y="108.0" width="470.0" height="470.0" rx="8.0" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.00" opacity="1.00"/><line x1="120.0" y1="520.0" x2="508.0" y2="520.0" stroke="#1B2A41" stroke-width="1.50" marker-end="url(#ar1B2A419)"/><line x1="120.0" y1="520.0" x2="120.0" y2="152.0" stroke="#1B2A41" stroke-width="1.50" marker-end="url(#ar1B2A419)"/><text x="505.0" y="508.0" font-family="Noto Sans CJK TC" font-size="15.0" fill="#1B2A41" text-anchor="end" font-weight="bold" opacity="1.00">σ&#x27;</text><text x="114.0" y="150.0" font-family="Noto Sans CJK TC" font-size="15.0" fill="#1B2A41" text-anchor="end" font-weight="bold" opacity="1.00">τ</text><line x1="120.0" y1="520.0" x2="500.0" y2="300.6" stroke="#1B2A41" stroke-width="2.20" stroke-linecap="round" opacity="1.00"/><text x="498.0" y="288.6" font-family="Noto Sans CJK TC" font-size="13.5" fill="#1B2A41" text-anchor="end" font-weight="bold" opacity="1.00">τ = σ&#x27; tanφ</text><path d="M166.0,520.0 A30,30 0 0 0 159.8,497.0" fill="none" stroke="#1B2A41" stroke-width="1.00" opacity="1.00" stroke-linejoin="round"/><text x="174.0" y="508.0" font-family="Noto Sans CJK TC" font-size="13.0" fill="#1B2A41" text-anchor="start" font-weight="normal" opacity="1.00">φ</text><path d="M180.0,520.0 A30.0,30.0 0 0 1 240.0,520.0 Z" fill="none" stroke="#9AA8B5" stroke-width="1.40" opacity="1.00" stroke-dasharray="4 4" stroke-linejoin="round"/><path d="M160.0,520.0 A40.0,40.0 0 0 1 240.0,520.0 Z" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="2.20" opacity="0.92" stroke-linejoin="round"/><path d="M240.0,520.0 A120.0,120.0 0 0 1 480.0,520.0 Z" fill="#FBE1DE" stroke="#C0392B" stroke-width="2.20" opacity="0.60" stroke-linejoin="round"/><line x1="240.0" y1="526.0" x2="240.0" y2="208.0" stroke="#4C6B8A" stroke-width="1.40" stroke-linecap="round" opacity="1.00" stroke-dasharray="5 4"/><text x="234.0" y="200.0" font-family="Noto Sans CJK TC" font-size="13.0" fill="#4C6B8A" text-anchor="end" font-weight="bold" opacity="1.00">σ&#x27;<tspan font-size="9.1" dy="3.9">v</tspan><tspan dy="-3.9">​</tspan>（固定）</text><circle cx="180.0" cy="485.3" r="4.0" fill="#1F7A4D" stroke="#FFFFFF" stroke-width="1.20" opacity="1.00"/><circle cx="300.0" cy="416.1" r="4.0" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.20" opacity="1.00"/><circle cx="160.0" cy="520.0" r="4.0" fill="#1F7A4D" stroke="#FFFFFF" stroke-width="1.20" opacity="1.00"/><text x="160.0" y="546.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#1F7A4D" text-anchor="middle" font-weight="normal" opacity="1.00">σ<tspan font-size="8.8" dy="3.8">3</tspan><tspan dy="-3.8">​</tspan> = K<tspan font-size="8.8" dy="3.8">a</tspan><tspan dy="-3.8">​</tspan>σ&#x27;<tspan font-size="8.8" dy="3.8">v</tspan><tspan dy="-3.8">​</tspan></text><circle cx="240.0" cy="520.0" r="4.0" fill="#4C6B8A" stroke="#FFFFFF" stroke-width="1.20" opacity="1.00"/><text x="240.0" y="568.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal" opacity="1.00"></text><circle cx="480.0" cy="520.0" r="4.0" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.20" opacity="1.00"/><text x="480.0" y="546.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="normal" opacity="1.00">σ<tspan font-size="8.8" dy="3.8">1</tspan><tspan dy="-3.8">​</tspan> = K<tspan font-size="8.8" dy="3.8">p</tspan><tspan dy="-3.8">​</tspan>σ&#x27;<tspan font-size="8.8" dy="3.8">v</tspan><tspan dy="-3.8">​</tspan></text><text x="152.0" y="450.0" font-family="Noto Sans CJK TC" font-size="14.0" fill="#1F7A4D" text-anchor="end" font-weight="bold" opacity="1.00">主動</text><text x="360.0" y="344.0" font-family="Noto Sans CJK TC" font-size="14.0" fill="#C0392B" text-anchor="middle" font-weight="bold" opacity="1.00">被動</text><text x="208.0" y="484.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#9AA8B5" text-anchor="middle" font-weight="normal" opacity="1.00">K<tspan font-size="8.8" dy="3.8">0</tspan><tspan dy="-3.8">​</tspan></text><rect x="90.0" y="562.0" width="11.0" height="11.0" rx="2.0" fill="#DFF0E4" stroke="#4C6B8A" stroke-width="0.80" opacity="1.00"/><text x="107.0" y="572.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">主動圓（往左長）</text><rect x="225.0" y="562.0" width="11.0" height="11.0" rx="2.0" fill="#FBE1DE" stroke="#4C6B8A" stroke-width="0.80" opacity="1.00"/><text x="242.0" y="572.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">被動圓（往右長）</text><rect x="360.0" y="562.0" width="11.0" height="11.0" rx="2.0" fill="#DCE6F0" stroke="#4C6B8A" stroke-width="0.80" opacity="1.00"/><text x="377.0" y="572.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">K<tspan font-size="8.8" dy="3.8">0</tspan><tspan dy="-3.8">​</tspan> 圓（未破壞）</text><text x="90.0" y="600.0" font-family="Noto Sans CJK TC" font-size="13.0" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">同一個 σ&#x27;<tspan font-size="9.1" dy="3.9">v</tspan><tspan dy="-3.9">​</tspan> 出發：圓往左長到相切＝主動，往右長到相切＝被動。</text><rect x="560.0" y="108.0" width="385.0" height="470.0" rx="8.0" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.20" opacity="1.00"/><text x="574.0" y="132.0" font-family="Noto Sans CJK TC" font-size="15.0" fill="#1B2A41" text-anchor="start" font-weight="bold" opacity="1.00">從幾何直接讀出 K</text><text x="574.0" y="158.0" font-family="Noto Sans CJK TC" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold" opacity="1.00">破壞時圓與包絡線相切：</text><text x="582.0" y="184.0" font-family="DejaVu Serif" font-size="14.5" fill="#1B2A41" text-anchor="start" font-weight="normal" opacity="1.00">sinφ = (σ<tspan font-size="10.1" dy="4.3">1</tspan><tspan dy="-4.3">​</tspan> − σ<tspan font-size="10.1" dy="4.3">3</tspan><tspan dy="-4.3">​</tspan>)/(σ<tspan font-size="10.1" dy="4.3">1</tspan><tspan dy="-4.3">​</tspan> + σ<tspan font-size="10.1" dy="4.3">3</tspan><tspan dy="-4.3">​</tspan>)</text><text x="574.0" y="216.0" font-family="Noto Sans CJK TC" font-size="13.5" fill="#1F7A4D" text-anchor="start" font-weight="normal" opacity="1.00">主動：σ<tspan font-size="9.4" dy="4.0">1</tspan><tspan dy="-4.0">​</tspan> = σ&#x27;<tspan font-size="9.4" dy="4.0">v</tspan><tspan dy="-4.0">​</tspan>（土被橫向拉開）</text><text x="582.0" y="240.0" font-family="DejaVu Serif" font-size="14.0" fill="#1F7A4D" text-anchor="start" font-weight="normal" opacity="1.00">σ<tspan font-size="9.8" dy="4.2">3</tspan><tspan dy="-4.2">​</tspan>/σ&#x27;<tspan font-size="9.8" dy="4.2">v</tspan><tspan dy="-4.2">​</tspan> = (1−sinφ)/(1+sinφ) = K<tspan font-size="9.8" dy="4.2">a</tspan><tspan dy="-4.2">​</tspan></text><text x="574.0" y="272.0" font-family="Noto Sans CJK TC" font-size="13.5" fill="#C0392B" text-anchor="start" font-weight="normal" opacity="1.00">被動：σ<tspan font-size="9.4" dy="4.0">3</tspan><tspan dy="-4.0">​</tspan> = σ&#x27;<tspan font-size="9.4" dy="4.0">v</tspan><tspan dy="-4.0">​</tspan>（土被橫向壓住）</text><text x="582.0" y="296.0" font-family="DejaVu Serif" font-size="14.0" fill="#C0392B" text-anchor="start" font-weight="normal" opacity="1.00">σ<tspan font-size="9.8" dy="4.2">1</tspan><tspan dy="-4.2">​</tspan>/σ&#x27;<tspan font-size="9.8" dy="4.2">v</tspan><tspan dy="-4.2">​</tspan> = (1+sinφ)/(1−sinφ) = K<tspan font-size="9.8" dy="4.2">p</tspan><tspan dy="-4.2">​</tspan></text><rect x="574.0" y="312.0" width="355.0" height="52.0" rx="6.0" fill="#DCE6F0" stroke="none" stroke-width="0.00" opacity="1.00"/><text x="586.0" y="334.0" font-family="Noto Sans CJK TC" font-size="15.0" fill="#1B2A41" text-anchor="start" font-weight="bold" opacity="1.00">K<tspan font-size="10.5" dy="4.5">p</tspan><tspan dy="-4.5">​</tspan> = 1/K<tspan font-size="10.5" dy="4.5">a</tspan><tspan dy="-4.5">​</tspan></text><text x="586.0" y="356.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">φ=30° → K<tspan font-size="8.8" dy="3.8">a</tspan><tspan dy="-3.8">​</tspan>=1/3、K<tspan font-size="8.8" dy="3.8">p</tspan><tspan dy="-3.8">​</tspan>=3（差 9 倍）</text><text x="574.0" y="396.0" font-family="Noto Sans CJK TC" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold" opacity="1.00">破壞面角度（由圓心角 2θ 得）</text><text x="582.0" y="420.0" font-family="Noto Sans CJK TC" font-size="13.0" fill="#1F7A4D" text-anchor="start" font-weight="normal" opacity="1.00">主動 θ<tspan font-size="9.1" dy="3.9">a</tspan><tspan dy="-3.9">​</tspan> = 45° + φ/2（較陡）</text><text x="582.0" y="442.0" font-family="Noto Sans CJK TC" font-size="13.0" fill="#C0392B" text-anchor="start" font-weight="normal" opacity="1.00">被動 θ<tspan font-size="9.1" dy="3.9">p</tspan><tspan dy="-3.9">​</tspan> = 45° − φ/2（較緩、破壞楔體大）</text><text x="574.0" y="472.0" font-family="Noto Sans CJK TC" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">K<tspan font-size="8.8" dy="3.8">0</tspan><tspan dy="-3.8">​</tspan> 的圓不與包絡線相切 —— 靜止狀態土體尚未破壞，K<tspan font-size="8.8" dy="3.8">0</tspan><tspan dy="-3.8">​</tspan> 是</text><text x="574.0" y="490.8" font-family="Noto Sans CJK TC" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal" opacity="1.00">彈性／原地層應力比，不能用強度公式推導。</text></svg>